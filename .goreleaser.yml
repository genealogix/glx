version: 2

before:
  hooks:
    - go mod verify
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: glx
    main: ./glx
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
checksum:
  name_template: 'checksums.txt'
release:
  # auto marks -alpha/-beta/-rc tags as GitHub pre-releases, keeping them out
  # of /releases/latest and the "Latest" badge. Without this, GoReleaser's
  # default (false) published every beta as a full release (#1007).
  prerelease: auto
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# Changelog is owned by changie (#858), not generated from commit messages.
# release.yml passes the curated per-version notes to GoReleaser via
# `--release-notes .changes/<version>.md`, so disable GoReleaser's own
# commit-scraping changelog (resolves #391, moots #386). The assembled
# CHANGELOG.md is still bundled in the release archive (see archives.files).
changelog:
  disable: true

version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools   # pinned dev/CI tools (govulncheck) — see tools/README.md
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - /website
      - /specification
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

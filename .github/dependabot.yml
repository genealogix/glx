version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directories:
      - /website
      - /specification
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: America/Chicago
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

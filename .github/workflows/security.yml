name: Security

# This workflow is the Code Scanning "setup" that GitHub associates with the
# `gosec` and `govulncheck` tools, so it must contain NOTHING but the jobs that
# produce and upload their SARIF. GitHub's tool status page attributes the
# conclusion of the whole *run* to every tool configured by the workflow — not
# the conclusion of the job that did the upload — so a failure in any unrelated
# job here marks both Go tools as "reporting errors" and raises a spurious
# "Code scanning configuration error" on the Security tab, even when both
# uploads succeeded with an empty `error` field. That is why the pin-currency
# check and the npm audit live in their own workflows (#1145):
#
#   .github/workflows/gosec-pin-currency.yml
#   .github/workflows/npm-audit.yml
#
# Do not add a job here unless it uploads code-scanning results.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            ci-tools/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run govulncheck
        # govulncheck is pinned via the tool directive in ci-tools/go.mod (single source
        # of truth, shared with `make vulncheck`), replacing the unpinned
        # `go install ...@latest` the govulncheck-action used. With -format sarif,
        # govulncheck exits 0 even when vulnerabilities are found, so findings surface
        # as Code Scanning alerts (uploaded below) rather than failing this job —
        # matching the prior action's behavior.
        #
        # Write to a temp file and rename into place only on success. A plain
        # `> govulncheck.sarif` redirection truncates the target before govulncheck
        # runs, so a build/load error (non-zero exit under bash's `-eo pipefail`)
        # would leave an empty/partial SARIF behind. With the staged rename, a failed
        # run produces no govulncheck.sarif, so the upload step below (guarded by
        # hashFiles) is skipped instead of shipping a truncated file.
        run: |
          go tool -modfile=ci-tools/go.mod govulncheck -format sarif ./... > govulncheck.sarif.tmp
          # Apply the osv-scanner.toml suppressions to govulncheck's output too, so the
          # two scanners share one reviewed list. Only module-level ("note") findings
          # are dropped: if a suppressed advisory ever becomes imported or called, it
          # is reported regardless. See scripts/filter-govulncheck-sarif.py.
          python3 scripts/filter-govulncheck-sarif.py osv-scanner.toml < govulncheck.sarif.tmp > govulncheck.sarif.filtered
          mv govulncheck.sarif.filtered govulncheck.sarif
          rm govulncheck.sarif.tmp

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('govulncheck.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gosec:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install gosec
        # gosec is NOT in ci-tools/go.mod on purpose: its autofix package pulls the
        # Google generative-ai-go / Cloud SDK / grpc / otel tree, whose (unreachable,
        # build-time-only) advisories would otherwise trip Dependency Review on every
        # PR. A version-pinned `go install` keeps it reproducible without committing
        # that graph. See ci-tools/README.md.
        #
        # The pinned version lives in .gosec-version (single source of truth, shared
        # with `make gosec`). Dependabot cannot propose a bump for it: its gomod
        # ecosystem only reads go.mod files, where gosec deliberately does not
        # appear, and its github-actions ecosystem only reads `uses:` references,
        # not a `go install ...@vX.Y.Z` line in a `run:` block. The weekly
        # gosec-pin-currency.yml workflow is what keeps the pin from rotting —
        # deliberately a separate workflow, see the header comment.
        #
        # TEMPORARY (securego/gosec#1771): every gosec release up to v2.29.0 is
        # built against golang.org/x/tools <= v0.49.0, whose export-data reader
        # stops at version 4. Go 1.27.2 writes version 5, so a plain install
        # type-checks nothing ("export data version 5 is greater than maximum
        # supported version 4") and exits 1. Until a gosec release carries
        # x/tools >= v0.50.0, build the pinned gosec in a throwaway module with
        # x/tools raised to v0.50.0, then return to the one-line
        # `go install ...@${v}`. Keep GOSEC_XTOOLS in sync with the Makefile.
        env:
          GOSEC_XTOOLS: v0.50.0
        run: |
          v="$(tr -d '[:space:]' < .gosec-version)"
          printf '%s' "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid .gosec-version: $v (expected vMAJOR.MINOR.PATCH)" >&2; exit 1; }
          build="$(mktemp -d)"
          cd "$build"
          go mod init gosec-build
          go get "github.com/securego/gosec/v2/cmd/gosec@${v}" "golang.org/x/tools@${GOSEC_XTOOLS}"
          go install github.com/securego/gosec/v2/cmd/gosec

      - name: Run gosec
        # Staged write + guarded upload, adapted from govulncheck above
        # (#1029) with one key difference: unlike govulncheck's SARIF mode,
        # gosec exits non-zero when it FINDS issues, and that exit must not
        # prevent the rename — findings are exactly what the upload exists to
        # ship. So the exit code is captured, the rename is gated on a
        # non-empty report file (build/load failures produce none), and the
        # step re-exits with gosec's status afterward so a findings run still
        # marks the job red as before.
        run: |
          status=0
          gosec -fmt sarif -out gosec.sarif.tmp ./... || status=$?
          if [ -s gosec.sarif.tmp ]; then
            mv gosec.sarif.tmp gosec.sarif
          fi
          exit "$status"

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('gosec.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gosec.sarif
          category: gosec

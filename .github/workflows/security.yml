name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            ci-tools/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run govulncheck
        # govulncheck is pinned via the tool directive in ci-tools/go.mod (single source
        # of truth, shared with `make vulncheck`), replacing the unpinned
        # `go install ...@latest` the govulncheck-action used. With -format sarif,
        # govulncheck exits 0 even when vulnerabilities are found, so findings surface
        # as Code Scanning alerts (uploaded below) rather than failing this job —
        # matching the prior action's behavior.
        #
        # Write to a temp file and rename into place only on success. A plain
        # `> govulncheck.sarif` redirection truncates the target before govulncheck
        # runs, so a build/load error (non-zero exit under bash's `-eo pipefail`)
        # would leave an empty/partial SARIF behind. With the staged rename, a failed
        # run produces no govulncheck.sarif, so the upload step below (guarded by
        # hashFiles) is skipped instead of shipping a truncated file.
        run: |
          go tool -modfile=ci-tools/go.mod govulncheck -format sarif ./... > govulncheck.sarif.tmp
          mv govulncheck.sarif.tmp govulncheck.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('govulncheck.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gosec:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install gosec
        # gosec is NOT in ci-tools/go.mod on purpose: its autofix package pulls the
        # Google generative-ai-go / Cloud SDK / grpc / otel tree, whose (unreachable,
        # build-time-only) advisories would otherwise trip Dependency Review on every
        # PR. A version-pinned `go install` keeps it reproducible without committing
        # that graph. See ci-tools/README.md.
        #
        # The pinned version lives in .gosec-version (single source of truth, shared
        # with `make gosec`). Neither Dependabot ecosystem sees a `go install ...@vX.Y.Z`
        # pin, so the weekly gosec-pin-currency job below is what keeps it from rotting.
        run: |
          v="$(tr -d '[:space:]' < .gosec-version)"
          printf '%s' "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid .gosec-version: $v (expected vMAJOR.MINOR.PATCH)" >&2; exit 1; }
          go install "github.com/securego/gosec/v2/cmd/gosec@${v}"

      - name: Run gosec
        run: gosec -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF to Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: gosec.sarif
          category: gosec

  gosec-pin-currency:
    name: gosec Pin Currency
    # Weekly run only: gosec's pin is invisible to Dependabot (deliberately not in
    # ci-tools/go.mod — see the Install gosec comment above — and the github-actions
    # ecosystem doesn't parse `go install ...@vX.Y.Z` run lines), so without this
    # check the hand-managed .gosec-version pin rots silently. Failing the weekly
    # scheduled run notifies maintainers; PR runs are unaffected, so an upstream
    # gosec release never blocks unrelated PRs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare .gosec-version against the latest gosec release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(tr -d '[:space:]' < .gosec-version)"
          printf '%s' "$pinned" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error file=.gosec-version::invalid .gosec-version: $pinned (expected vMAJOR.MINOR.PATCH)"; exit 1; }
          latest="$(gh api repos/securego/gosec/releases/latest --jq .tag_name)" || { echo "::error::could not query the latest securego/gosec release from the GitHub API"; exit 1; }
          if [ "$pinned" != "$latest" ]; then
            echo "::error file=.gosec-version::pinned gosec $pinned is behind the latest release $latest — bump .gosec-version (and re-run gosec locally with 'make gosec' to catch findings from new analyzers)"
            exit 1
          fi
          echo "gosec pin $pinned is current"

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

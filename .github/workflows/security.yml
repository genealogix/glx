name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run govulncheck
        # govulncheck is pinned via the tool directive in tools/go.mod (single source
        # of truth, shared with `make vulncheck`), replacing the unpinned
        # `go install ...@latest` the govulncheck-action used. With -format sarif,
        # govulncheck exits 0 even when vulnerabilities are found, so findings surface
        # as Code Scanning alerts (uploaded below) rather than failing this job —
        # matching the prior action's behavior.
        run: go tool -modfile=tools/go.mod govulncheck -format sarif ./... > govulncheck.sarif

      - name: Upload SARIF to Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  gosec:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run gosec
        # gosec is pinned via the tool directive in tools/go.mod (single source of
        # truth, shared with `make gosec`); -modfile keeps the main module's graph clean.
        run: go tool -modfile=tools/go.mod gosec -quiet ./...

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

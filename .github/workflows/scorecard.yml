name: OpenSSF Scorecard

# Deliberate choices in this file (#1020) — do not "harmonize" them away:
#
# - NO pull_request trigger. publish_results requires id-token: write (OIDC),
#   which fork PRs cannot safely hold (their GITHUB_TOKEN is capped at read).
#   Adding PR coverage would break the OIDC publish model. Scorecard runs on
#   push-to-main, the weekly cron, and manual dispatch only.
# - publish_results is verified SERVER-SIDE: it requires top-level read-only
#   permissions and an allowlisted step set. Adding a build or custom step to
#   this job will fail publishing at runtime — keep this workflow minimal.
# - This coexists with CodeQL: the SARIF upload below uses category:
#   scorecard, a distinct tool identity, so it does not collide with CodeQL's
#   default-setup SARIF handling.
on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC (matches security.yml)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write   # OIDC for publish_results
      contents: read
      actions: read     # workflow YAML analysis (Token-Permissions, Pinned-Dependencies)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # SHA-pinned (#1019): every other third-party action in this repo is
        # SHA-pinned with a version comment, and scorecard-action's own
        # Pinned-Dependencies check scores tag pins lower. The tag-repoint
        # class this guards against is CVE-2025-30066 (tj-actions).
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4 -- only vX.Y.Z tags published, no floating v2; do not "tidy" to @v2 (#779)
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload SARIF to Code Scanning
        # Same SHA + version-comment pin as security.yml's upload-sarif steps.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: scorecard-results.sarif
          # A distinct tool category — does not collide with CodeQL default
          # setup; compare security.yml's govulncheck/gosec categories.
          category: scorecard

name: npm Audit

# Deliberately its own workflow rather than a job in security.yml: this gate
# fails whenever a new moderate advisory lands in the website's npm tree (see
# #1030), and security.yml is the Code Scanning setup for the gosec and
# govulncheck tools. A failing run of that workflow — for any reason, including
# a job that uploads no SARIF — marks both Go tools as "reporting errors" on the
# code scanning tool status page and raises a spurious "Code scanning
# configuration error" on the Security tab. See #1145.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 06:00 UTC (matches security.yml)
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Audit every npm tree Dependabot watches (#1028): /specification was
      # installed by CI and watched by Dependabot but never audited.
      fail-fast: false
      matrix:
        package: [website, specification]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test the audit gate
        run: node --test ../scripts/npm-audit-gate.test.mjs

      - name: Run npm audit
        # npm's --fetch-retries does not cover the bulk advisories endpoint,
        # which times out under registry load and fails the run with "audit
        # endpoint returned an error" while reporting no vulnerabilities at
        # all. Retry the whole command with backoff on that class of failure
        # only. The JSON report goes to scripts/npm-audit-gate.mjs, which
        # exits 3 when the output is not an audit report (a network failure:
        # retried) and otherwise decides the run, so a genuine advisory is
        # never retried or masked.
        #
        # The gate honours <tree>/audit-accepted.json: an advisory accepted
        # for one exact package version, only while that entry's verify
        # command passes (see the script's header). Any other finding at
        # moderate or above fails exactly as plain npm audit would.
        shell: bash
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            npm audit --json --audit-level=moderate --fetch-timeout=60000 >audit.json 2>audit.err || true
            set +e
            node ../scripts/npm-audit-gate.mjs audit.json
            status=$?
            set -e
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            cat audit.err audit.json
            if ! grep -qE 'audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up|E50[0-9]|E429' audit.err audit.json; then
              echo "::error::npm audit produced no report"
              exit 1
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::npm audit could not reach the registry (attempt $attempt of $attempts); retrying"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::npm audit could not reach the registry after $attempts attempts"
          exit 1

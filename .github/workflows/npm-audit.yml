name: npm Audit

# Deliberately its own workflow rather than a job in security.yml: this gate
# fails whenever a new moderate advisory lands in the website's npm tree (see
# #1030), and security.yml is the Code Scanning setup for the gosec and
# govulncheck tools. A failing run of that workflow — for any reason, including
# a job that uploads no SARIF — marks both Go tools as "reporting errors" on the
# code scanning tool status page and raises a spurious "Code scanning
# configuration error" on the Security tab. See #1145.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Monday at 06:00 UTC (matches security.yml)
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  npm-audit:
    name: npm Audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Audit every npm tree Dependabot watches (#1028): /specification was
      # installed by CI and watched by Dependabot but never audited.
      fail-fast: false
      matrix:
        package: [website, specification]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # npm's --fetch-retries does not cover the bulk advisories endpoint,
        # which times out under registry load and fails the run with "audit
        # endpoint returned an error" while reporting no vulnerabilities at
        # all. Retry the whole command with backoff on that class of failure
        # only: npm audit exits 1 for both network errors and real findings,
        # so the two are told apart by the error text, and a genuine advisory
        # is never retried or masked.
        shell: bash
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if out=$(npm audit --audit-level=moderate --fetch-timeout=60000 2>&1); then
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out"
            if ! grep -qE 'audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up|E50[0-9]|E429' <<<"$out"; then
              echo "::error::npm audit reported vulnerabilities at or above the moderate level"
              exit 1
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::npm audit could not reach the registry (attempt $attempt of $attempts); retrying"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::npm audit could not reach the registry after $attempts attempts"
          exit 1

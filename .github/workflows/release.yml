name: Release Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

permissions: read-all

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write       # OIDC for cosign keyless signing + Sigstore attestation
      attestations: write   # store the build-provenance attestation (issue #256)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2   # pin: action only publishes vX.Y.Z tags, no floating v4 (see #779 for the same lesson on scorecard-action)
        with:
          cosign-release: 'v3.0.6'   # pin: --bundle output format is part of our release verification contract

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for every released artifact (issue #256). Reads the
      # sha256 checksums GoReleaser wrote (name_template "checksums.txt") so one
      # attestation covers all archives. actions/attest-build-provenance is just a
      # composite wrapper around actions/attest with empty predicate inputs, so we
      # call actions/attest directly; with no predicate it emits the SLSA
      # provenance predicate. Verify: gh attestation verify --owner genealogix <file>
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Announce release on Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          curl -sSf -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"GLX ${TAG}\",
                \"url\": \"${RELEASE_URL}\",
                \"description\": \"A new version of the GLX CLI has been released.\",
                \"color\": 5814783,
                \"fields\": [
                  {\"name\": \"Release Notes & Downloads\", \"value\": \"[View on GitHub](${RELEASE_URL})\"}
                ]
              }]
            }" \
            "$DISCORD_WEBHOOK"

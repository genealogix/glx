name: Release Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

permissions: read-all

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write   # OIDC for cosign keyless signing
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2   # pin: action only publishes vX.Y.Z tags, no floating v4 (see #779 for the same lesson on scorecard-action)
        with:
          cosign-release: 'v3.0.6'   # pin: --bundle output format is part of our release verification contract

      # The GitHub Release body comes from changie's curated per-version notes
      # (#391), not from commit scraping (disabled in .goreleaser.yml). The file
      # is produced by `changie batch` on the prepare-release PR and committed
      # before the tag is pushed (see prepare-release.yml). Stage the tag via
      # env before use in run: per the .github/CLAUDE.md workflow-injection rule.
      - name: Resolve changie release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE=".changes/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes file $NOTES_FILE not found at the tagged commit. Run the 'Prepare release' workflow (changie batch + merge) and merge that PR before tagging." >&2
            exit 1
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --release-notes=${{ steps.notes.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce release on Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          curl -sSf -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"GLX ${TAG}\",
                \"url\": \"${RELEASE_URL}\",
                \"description\": \"A new version of the GLX CLI has been released.\",
                \"color\": 5814783,
                \"fields\": [
                  {\"name\": \"Release Notes & Downloads\", \"value\": \"[View on GitHub](${RELEASE_URL})\"}
                ]
              }]
            }" \
            "$DISCORD_WEBHOOK"

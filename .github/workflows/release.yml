name: Release Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

# Default for any future job that doesn't declare its own block: contents read,
# every unlisted scope none (read-all granted read on all scopes). The release
# job re-declares the write scopes it needs at job level, which fully overrides
# this default, so it is unaffected. (#1012)
permissions:
  contents: read

# Serialize release runs. The sanctioned re-run flow (.github/CLAUDE.md,
# "never move a published tag") cuts a NEW patch tag rather than moving a
# published one, so a per-ref group would never serialize anything — key on the
# workflow so a hotfix tag pushed behind a still-running release queues instead
# of racing its asset uploads, cosign signing, and Discord announce.
# cancel-in-progress MUST stay false — cancelling between asset upload and
# signing would leave an unsigned/partially-signed release. (#1008)
concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write       # OIDC for cosign keyless signing + Sigstore attestation
      attestations: write   # store the build-provenance attestation (issue #256)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # cache-poisoning guard (#1051): this privileged job holds id-token: write
          # for cosign keyless signing, so it must NOT restore a Go build cache that
          # pull_request-triggered workflows (security.yml, validate-spec.yml) can
          # populate — a poisoned cache entry would taint the binaries upstream of
          # signing. The clean `go mod download` below makes the cache near-worthless
          # on a cold tagged build anyway. Keep this false; do not "optimize" it back.
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2   # pin: action only publishes vX.Y.Z tags, no floating v4 (#938; same no-floating-major pitfall as ossf/scorecard-action, #779)
        with:
          cosign-release: 'v3.0.6'   # pin: --bundle output format is part of our release verification contract

      # The GitHub Release body comes from changie's curated per-version notes
      # (#391), not from commit scraping (disabled in .goreleaser.yml). The file
      # is produced by `changie batch` on the prepare-release PR and committed
      # before the tag is pushed (see prepare-release.yml). Stage the tag via
      # env before use in run: per the .github/CLAUDE.md workflow-injection rule.
      - name: Resolve changie release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES_FILE=".changes/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes file $NOTES_FILE not found at the tagged commit. Run the 'Prepare release' workflow (changie batch + merge) and merge that PR before tagging." >&2
            exit 1
          fi
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the GoReleaser tool to a minor (patch-floating), not '~> v2':
          # the action SHA pin above pins the action, not the tool binary it
          # downloads, so '~> v2' would build a tagged release with whatever
          # v2.x is newest at run time — different artifacts from the same
          # source. Dependabot does NOT manage this input, and no currency gate
          # watches it yet (#1215): bump it deliberately. (#1009)
          version: '~> v2.18'
          args: release --release-notes=${{ steps.notes.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for every released artifact (issue #256). Reads the
      # sha256 checksums GoReleaser wrote (name_template "checksums.txt") so one
      # attestation covers all archives. actions/attest-build-provenance is just a
      # composite wrapper around actions/attest with empty predicate inputs, so we
      # call actions/attest directly; with no predicate it emits the SLSA
      # provenance predicate. Verify: gh attestation verify --owner genealogix <file>
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Announce release on Discord
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        # Build the payload with jq --arg (correct JSON-string escaping) instead
        # of hand-spliced strings: the -beta* trigger glob admits any non-slash
        # character, and git permits `"` in a ref name, so splicing the raw
        # $GITHUB_REF_NAME into the body could emit malformed JSON. The tag is
        # additionally @uri-encoded where it lands in the URL, so characters
        # like `"` or `)` cannot break the URL or the Markdown link.
        # GITHUB_REPOSITORY/GITHUB_REF_NAME are runner-provided env vars — no
        # ${{ }} interpolation in run:. (#1010)
        run: |
          jq -n --arg tag "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" \
            '("https://github.com/" + $repo + "/releases/tag/" + ($tag | @uri)) as $url |
            {
              embeds: [{
                title: ("GLX " + $tag),
                url: $url,
                description: "A new version of the GLX CLI has been released.",
                color: 5814783,
                fields: [
                  {name: "Release Notes & Downloads", value: ("[View on GitHub](" + $url + ")")}
                ]
              }]
            }' \
          | curl -sSf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

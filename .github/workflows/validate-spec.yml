# The repo's primary CI pipeline: builds bin/glx, runs the only full Go test
# suite + coverage upload, validates schemas and example archives, and runs the
# diff-independent drift checks. (Named "Validate Specification" historically —
# renamed because contributors looking for "where do tests run" won't open a
# spec-validation workflow, #1041.)
#
# Drift-check ownership split (#1043): diff-independent, deterministic drift
# checks that can run on push AND pull_request live here (check-code-drift,
# check-memory-drift, check-drift-allowlist, and the drift-script unit tests).
# PR-diff-based drift gates — which need a base branch to diff against — live
# in drift-checks.yml (spec-schema-parity #309, schema-compat #311). The unit
# tests for those scripts run here because the specification npm deps and Node
# are already set up in validate-schemas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-spec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

# Job-naming rule (#1042): every job gets a human-readable name: EXCEPT
# test-conformance, validate-schemas, and validate-examples — their KEYS are
# the required status-check contexts in the Main Protection ruleset, and a
# name: changes the displayed context, which would leave the ruleset waiting
# on checks that never report and deadlock merges. Rename those only in
# lockstep with a ruleset update.
jobs:
  validate-mod:
    name: Go modules tidy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            ci-tools/go.sum

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify ci-tools/go.mod is tidy
        run: go -C ci-tools mod tidy -diff

  check-code-drift:
    name: Schema vs Go-code drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect schema/code drift
        run: make check-code-drift

  check-memory-drift:
    name: Memory-file drift (CLAUDE.md vs reality)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect memory-file drift
        run: make check-memory-drift

  validate-schemas:
    # No name: — job key is a required status-check context (see note above).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: specification/package-lock.json

      - name: Install schema validation deps
        run: npm ci --prefix specification

      - name: Validate JSON Schemas
        run: make check-schemas

      - name: Validate drift allowlist
        run: make check-drift-allowlist

      # Unit-test the Node drift-check scripts (spec-schema parser, schema-compat
      # classifier). Runs here because specification deps (json-schema-diff-validator)
      # are already installed above and Node is set up.
      - name: Unit-test drift-check scripts
        run: make test-scripts

  build-cli:
    name: Build CLI & discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Build glx CLI
        run: |
          # Build the CLI once and share it with the matrix via an artifact,
          # so each example job doesn't pay the build cost again.
          go build -o bin/glx ./glx

      - name: Upload glx binary
        uses: actions/upload-artifact@v7
        with:
          name: glx-binary
          path: bin/glx
          retention-days: 1
          if-no-files-found: error

      - name: Discover examples
        id: discover
        run: |
          # Build the matrix dynamically so newly added example directories are
          # validated automatically — no need to edit this workflow.
          # Guard the directory: under the runner's `bash -eo pipefail`, find's
          # nonzero exit on a missing path aborts the whole step before the
          # echo, so a renamed/removed docs/examples would hard-fail discovery
          # instead of degrading to an empty matrix (#1036). The aggregator
          # treats an empty matrix with a green build as a pass.
          if [ -d docs/examples ]; then
            examples=$(find docs/examples -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          else
            examples='[]'
          fi
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
          echo "Discovered examples: $examples"

  validate-example:
    name: Validate example (${{ matrix.example }})
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Validate every example even if one fails, so the UI shows the full picture.
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.build-cli.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download glx binary
        uses: actions/download-artifact@v8
        with:
          name: glx-binary
          path: bin

      - name: Validate ${{ matrix.example }}
        env:
          # Stage matrix value in env to avoid shell injection via ${{ }} in run.
          EXAMPLE: ${{ matrix.example }}
        run: |
          # upload-artifact zips and strips the exec bit; restore it before running
          chmod +x bin/glx
          ./bin/glx validate "docs/examples/$EXAMPLE/"

  # Aggregator: keeps a stable `validate-examples` status check (required by the
  # repo ruleset) regardless of how many entries the matrix expands to.
  # Needs build-cli too, so a build break is reported as a build break instead
  # of being misattributed to example validation (validate-example is skipped
  # when build-cli fails, and `skipped` is not `failure`).
  validate-examples:
    # No name: — job key is a required status-check context (see note above).
    needs: [build-cli, validate-example]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix results
        env:
          BUILD_RESULT: ${{ needs.build-cli.result }}
          RESULT: ${{ needs.validate-example.result }}
        run: |
          echo "build-cli result: $BUILD_RESULT"
          echo "Example validation matrix result: $RESULT"
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::build-cli did not succeed (result: $BUILD_RESULT) — example validation never ran"
            exit 1
          fi
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "::error::One or more example validations failed"
            exit 1
          fi
          # success, or skipped with a green build (empty matrix): nothing to
          # validate counts as a pass.
          echo "Example validation passed"

  test-conformance:
    # No name: — job key is a required status-check context (see note above).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Go Tests
        run: |
          # Run all tests for both CLI and core library packages
          # Includes slow/large file tests (habsburg.ged with 34,020 persons)
          # Capture stderr — fail if any "Warning:" text is emitted.
          # A plain synchronous redirect (not an async process-substitution
          # tee) guarantees the log is complete before it is inspected; the
          # exit code is captured explicitly so a test failure still fails
          # the step after stderr has been surfaced (#1033).
          # -coverpkg attributes cross-package coverage: go-glx code driven by
          # glx CLI tests counts toward go-glx instead of nothing. Without it
          # each test only measures its own package and the Codecov number is
          # misattributed. Note the flag also puts test-less packages in the
          # denominator at 0%, so the headline aggregate may drop — that is
          # accuracy, not a regression (#1038).
          status=0
          go test ./glx/... ./go-glx/... ./tools/... -v -timeout 15m \
            -coverpkg=./glx/...,./go-glx/...,./tools/... \
            -coverprofile=coverage.out 2> /tmp/test-stderr.log || status=$?
          cat /tmp/test-stderr.log >&2
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # The go tool itself emits "warning: no packages being tested depend
          # on matches for pattern ..." for any test binary that doesn't import
          # every -coverpkg pattern (e.g. ./tools/... binaries not importing
          # go-glx). That's benign tool output, not a test warning — exclude
          # exactly it before the check.
          if grep -viE '^warning: no packages being tested depend on matches' /tmp/test-stderr.log \
            | grep -qiE '(^|[[:space:]])Warning:'; then
            echo "::error::Tests emitted warnings on stderr — see log above"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

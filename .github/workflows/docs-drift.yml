name: Docs Drift

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'docs/cli/**'
      - '.github/workflows/docs-drift.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'docs/cli/**'
      - '.github/workflows/docs-drift.yml'

permissions:
  contents: read

concurrency:
  group: docs-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  docs-cli-drift:
    name: CLI docs match source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate CLI docs
        run: make docs-cli

      - name: Fail on drift
        run: |
          # `git status --porcelain` catches both modified AND untracked files,
          # so a new command whose generated page was forgotten in `git add`
          # still trips the check (plain `git diff --exit-code` would miss it).
          drift=$(git status --porcelain -- docs/cli/)
          if [ -n "$drift" ]; then
            echo "::error::docs/cli/ is out of date. Run 'make docs-cli' locally and commit the result."
            echo "$drift"
            exit 1
          fi

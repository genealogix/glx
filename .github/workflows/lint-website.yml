name: Lint Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'go-glx/**'
      - 'specification/5-standard-vocabularies/**'
      - 'go.mod'
      - 'go.sum'
      - 'public/_headers'
      - 'scripts/hooks/**'
      - '.github/workflows/lint-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'go-glx/**'
      - 'specification/5-standard-vocabularies/**'
      - 'go.mod'
      - 'go.sum'
      - 'public/_headers'
      - 'scripts/hooks/**'
      - '.github/workflows/lint-website.yml'

permissions:
  contents: read

concurrency:
  group: lint-website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        # Same command `make lint` runs; --max-warnings 0 lives in the npm
        # script itself so local and CI strictness can't drift.
        run: npm run lint

      - name: Test staged lint hooks
        run: node --test ../scripts/hooks/staged.test.mjs

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test converter input guards
        run: go test -race converter/wasm/convert_js.go converter/wasm/convert_js_test.go

      - name: Build website and converter
        run: npm run build

      - name: Install browsers for converter tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser conversion
        run: npm run test:converter

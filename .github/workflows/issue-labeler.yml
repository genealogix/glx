name: Auto-label issues from template

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label-area:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo (for .github/issue-areas.yml)
        uses: actions/checkout@v6

      - name: Ensure needs-triage label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: --force updates if exists, creates if not.
          # Runs before any --add-label so the triage fallback can't no-op on
          # the very first parse failure in a repo that lacks the label.
          gh label create needs-triage \
            --repo "${{ github.repository }}" \
            --color FBCA04 \
            --description "Issue intake couldn't classify the Area — maintainer triage required" \
            --force

      - name: Apply area label from template dropdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json body --jq '.body')

          # Extract area from form dropdown (renders as "### Area\n\n<value>")
          AREA=$(echo "$BODY" | awk '/^### Area/{getline; getline; print; exit}' | tr -d '[:space:]')

          # Single source of truth for valid areas: .github/issue-areas.yml
          # (synchronized with the templates' Area dropdowns by
          # .github/workflows/issue-templates-drift.yml).
          VALID_LABELS=$(yq '.areas[]' .github/issue-areas.yml | xargs)

          # Default to needs-triage; only the recognized-area branch overrides.
          LABEL=needs-triage
          if [ -z "$AREA" ]; then
            echo "Empty AREA parsed from body — falling through to needs-triage."
          elif echo "$VALID_LABELS" | grep -wqF "$AREA"; then
            LABEL="$AREA"
          else
            echo "Parsed area '$AREA' is not in VALID_LABELS ($VALID_LABELS) — falling through to needs-triage."
          fi

          echo "Applying label: $LABEL"
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "$LABEL"

name: Dependency Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: "false"

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Explicitly state the action's current defaults so the workflow
          # is auditable in isolation and a future major-version default
          # flip can't change our security posture silently (#930).
          vulnerability-check: true
          license-check: true
          # The action filters the dependency diff by scope BEFORE either
          # check sees it, and the default is `runtime` only. Both npm
          # manifests here (`website/`, `specification/`) are 100%
          # devDependencies, so with the default the license policy below
          # would never evaluate a single npm package. `development` is
          # therefore required for the policy to mean anything (#340). The
          # side effect on `vulnerability-check` is intentional and not new
          # coverage: `npm-audit.yml` already runs `npm audit
          # --audit-level=moderate` over both trees without `--omit=dev`.
          fail-on-scopes: runtime, development
          # License policy (#340). The `deny-licenses` input is deprecated
          # (actions/dependency-review-action#938), so this is an allow-list:
          # anything not named here fails the check and forces an explicit
          # decision in review.
          #
          # This list is a deliberate SUPERSET of the Go allowlist kept in
          # sync between `.github/workflows/license-compliance.yml`
          # (`go-licenses check --allowed_licenses=...`) and the `license-check`
          # target in `Makefile`. It has to be a superset because Dependency
          # Review sees three surfaces those two never do: the npm trees in
          # `website/` and `specification/`, the GitHub Actions graph, and the
          # second Go module `ci-tools/go.mod` (`go-licenses check ./...` runs
          # in the root module only). When you add a license to the Go
          # allowlist, add it here too; the reverse is not required.
          #
          # Go allowlist, verbatim: Apache-2.0, MIT, BSD-2-Clause,
          # BSD-3-Clause, ISC, MPL-2.0. MPL-2.0 is file-level copyleft and
          # also appears in the npm tree (lightningcss, via vitepress).
          #
          # npm-only additions, each with the package that needs it:
          #   CC0-1.0       — @iconify-json/simple-icons (website)
          #   BlueOak-1.0.0 — minimatch >=10 (website)
          #   Python-2.0    — argparse@2 (specification, via js-yaml)
          # Nothing in the repo uses 0BSD or Unlicense today; they are
          # pre-approved deliberately because both are public-domain-
          # equivalent and impose no obligation a review decision could
          # weigh. Every license that does carry obligations still has to be
          # added here explicitly.
          #   0BSD, Unlicense
          #
          # LicenseRef-scancode-google-patent-license-golang is the Go
          # PATENTS file, which ships alongside the BSD-3-Clause LICENSE in
          # every golang.org/x module. Newer x/* releases resolve as the
          # compound expression `BSD-3-Clause AND
          # LicenseRef-scancode-google-patent-license-golang`, which fails
          # against BSD-3-Clause alone. It is allowed because it is an
          # *additional* grant: Google licenses its patents reading on Go for
          # use in implementations of Go, terminating only if the user sues
          # over Go patents. It adds a right on top of BSD-3-Clause and
          # imposes no obligation on GLX or on downstream consumers, so
          # there is nothing for a review decision to weigh. The underlying
          # copyright license is BSD-3-Clause, already allowed above.
          #   LicenseRef-scancode-google-patent-license-golang
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0,
            CC0-1.0, BlueOak-1.0.0, Python-2.0, 0BSD, Unlicense,
            LicenseRef-scancode-google-patent-license-golang
          # Note: a dependency whose license the action cannot resolve at all
          # is reported but does NOT fail the check (upstream behaviour), so
          # the allow-list gates known licenses, not unknown ones — e.g.
          # `fsfe/reuse-action` has no license detected by the API.
          show-openssf-scorecard: true
          # Default warn level is 3; many maintained projects score 5-7,
          # so 5 surfaces barely-maintained deps without noise from
          # healthy ones. Informational only - never fails the check.
          warn-on-openssf-scorecard-level: 5
          # Poll the dependency-graph API until the snapshot is indexed,
          # avoiding incomplete diffs from the Go dependency-submission
          # timing race. Recommended for Go projects per the action README.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          # PR comments require write access; on forked PRs the token is
          # read-only so the comment is silently skipped. The check still
          # blocks the PR regardless.
          comment-summary-in-pr: on-failure

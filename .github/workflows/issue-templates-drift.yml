name: Issue templates — Area drift check

# Fails CI if the Area dropdown options in any issue-form template diverge from
# the canonical list in .github/issue-areas.yml, or if any template's Area
# dropdown lacks the `id: area` key.
#
# The `id: area` key is used by this drift check itself (to locate the Area
# dropdown by id rather than label-text) and is a prerequisite for any future
# form-aware labeler action. The existing .github/workflows/issue-labeler.yml
# does NOT currently consume the field id — it parses the rendered markdown
# body via awk — but adding the id now means a future swap to a form-aware
# labeler won't need to touch the templates again.

on:
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/issue-areas.yml'
      - '.github/workflows/issue-labeler.yml'
      - '.github/workflows/issue-templates-drift.yml'
  push:
    branches: [main]
    paths:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/issue-areas.yml'
      - '.github/workflows/issue-labeler.yml'
      - '.github/workflows/issue-templates-drift.yml'

permissions:
  contents: read
  issues: read   # gh label list, for the label-existence check (#946)

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # PyYAML is NOT preinstalled on the runner image (it's not in the
      # actions/runner-images manifest, and it's not stdlib), so install it
      # explicitly into a toolcache interpreter — the system Python is
      # PEP 668-locked on Ubuntu 24.04 (#947). Python stays the right tool for
      # THIS file (structural navigation of the template body), while the
      # labeler's flat .areas[] read moved to the manifest-pinned yq.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Compare each template's Area dropdown to the canonical list
        run: |
          python3 <<'PY'
          import glob, os, sys, yaml
          SOURCE = '.github/issue-areas.yml'
          # Discover templates from the directory (the workflow trigger already
          # globs it) instead of a hard-coded list, so a 4th template is
          # checked the run it lands with no edit here (#949).
          # config.yml is the chooser config (blank_issues_enabled), not a form.
          SKIP = {'config.yml'}
          # Opt-out for forms intentionally shipped without an Area dropdown
          # (none today; add e.g. 'security.yml' here deliberately).
          NO_AREA = set()
          templates = sorted(
              p for p in glob.glob('.github/ISSUE_TEMPLATE/*.yml')
              if os.path.basename(p) not in SKIP | NO_AREA
          )
          if not templates:
              print('::error::no issue-form templates found under .github/ISSUE_TEMPLATE/')
              sys.exit(1)

          with open(SOURCE) as f:
              expected = sorted(yaml.safe_load(f).get('areas') or [])
          if not expected:
              print(f'::error file={SOURCE}::canonical .areas list is empty')
              sys.exit(1)

          fail = 0
          for tpl in templates:
              # A discovered template can be malformed YAML entirely — catch
              # the parse error and emit the same clean annotation the other
              # failure modes get, instead of an unformatted traceback.
              try:
                  with open(tpl) as f:
                      doc = yaml.safe_load(f)
              except yaml.YAMLError as exc:
                  msg = str(exc).replace('\n', ' ')
                  print(f'::error file={tpl}::template is not parseable YAML: {msg}')
                  fail = 1
                  continue
              if not isinstance(doc, dict):
                  print(f'::error file={tpl}::template root is not a YAML mapping')
                  fail = 1
                  continue
              area_entries = [
                  b for b in (doc.get('body') or [])
                  if isinstance(b, dict) and b.get('id') == 'area'
              ]
              if len(area_entries) != 1:
                  # The drift check locates the Area dropdown by id == "area".
                  # Without exactly one such entry it cannot compare options;
                  # also, future form-aware labeler tooling will require the id.
                  # For a discovered new template this doubles as the "added a
                  # form, forgot the Area dropdown" guard.
                  print(f'::error file={tpl}::expected exactly one dropdown with id: area, found {len(area_entries)}')
                  fail = 1
                  continue
              attributes = area_entries[0].get('attributes')
              options = attributes.get('options') if isinstance(attributes, dict) else None
              if not isinstance(options, list):
                  print(f'::error file={tpl}::the id: area dropdown has no attributes.options list')
                  fail = 1
                  continue
              # Deliberately compare sorted() on both sides: the contract is
              # option SET equality; per-template dropdown order is tolerated.
              actual = sorted(options)
              if actual != expected:
                  print(f'::error file={tpl}::Area options diverge from {SOURCE}')
                  print(f'  expected (from {SOURCE}): {expected}')
                  print(f'  actual   (from {tpl}):    {actual}')
                  fail = 1

          if fail:
              sys.exit(1)
          print(f"All {len(templates)} templates' Area options match {SOURCE}.")
          PY

      # The option-parity check above ties source <-> templates; this ties
      # source <-> repo labels. Without it, an area added to the source and
      # templates but with no matching repo label passes the drift gate, then
      # the first issue filed with that Area hard-fails the labeler's
      # `gh issue edit --add-label` (gh does not auto-create labels) and the
      # issue ends up with NO label at all — worse than needs-triage (#946).
      - name: Verify a repo label exists for every area
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Plain assignments (not process substitution) so a yq or gh failure
          # fails the step CLOSED instead of silently yielding zero areas to
          # check; --paginate so the gate inspects every label, not one page.
          areas=$(yq '.areas[]' .github/issue-areas.yml)
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/labels" --paginate --jq '.[].name')
          missing=0
          while IFS= read -r area; do
            if ! printf '%s\n' "$labels" | grep -Fxq "$area"; then
              echo "::error file=.github/issue-areas.yml::area '$area' has no matching repo label — create it (gh label create \"$area\") before merging"
              missing=1
            fi
          done <<< "$areas"
          if [ "$missing" -eq 0 ]; then
            echo "Every area in issue-areas.yml has a matching repo label."
          fi
          exit "$missing"

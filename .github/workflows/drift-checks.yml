name: Drift checks

# Deterministic drift detection (no LLM). The on-demand check-* skills handle
# the semantic remainder locally; this workflow catches the mechanical cases.

# Pull-request only: schema-compat diffs against the PR base. A push-to-main
# run has no meaningful base — origin/main...HEAD is empty. The spec↔schema
# parity check runs in the required validate-schemas job of validate-spec.yml;
# see scripts/drift-checks/README.md for the gate policy.
on:
  pull_request:
    paths:
      - "specification/**"
      - "scripts/drift-checks/**"
      - ".github/workflows/drift-checks.yml"

permissions:
  contents: read

concurrency:
  group: drift-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-compat:
    name: schema ↔ schema backward-compat (#311)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base branch to diff schemas against
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: specification
      # Hard-fail: a backward-incompatible schema change would invalidate
      # existing archives, so it blocks the merge.
      - run: node specification/schema-compat.mjs

name: Drift checks

# Deterministic drift detection (no LLM). The on-demand check-* skills handle
# the semantic remainder locally; this workflow catches the mechanical cases.

# Pull-request only: both checks are PR-diff gates (schema-compat diffs against
# the PR base; spec-schema-parity reports on the changed tree). A push-to-main run
# has no meaningful base — origin/main...HEAD is empty — so it would be a no-op.
# A direct push to main therefore bypasses the backward-compat gate; that is
# acceptable because the repo ruleset requires changes to land via PR (where this
# gate runs), so no schema change reaches main without passing it.
on:
  pull_request:
    paths:
      - "specification/**"
      - "scripts/drift-checks/**"
      - ".github/workflows/drift-checks.yml"

permissions:
  contents: read

concurrency:
  group: drift-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-schema-parity:
    name: spec ↔ schema field parity (#309)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Hard-fail: spec↔schema field parity is enforced (#309). The table parser
      # rode warn-only through the beta.12 cycle with zero false positives and
      # is pinned by the spec-schema-drift.test.mjs fixtures, so any
      # documented-but-unschema'd (or undocumented) field now turns this job
      # red instead of passing with a warning. Caveat: like schema-compat below,
      # this job's context is not yet in the Main Protection ruleset's
      # required_status_checks, so a red run shows on the PR but does not by
      # itself hold the merge button.
      # Escape hatch for local runs: the script defaults to warn-only, so plain
      # `node scripts/drift-checks/spec-schema-drift.mjs` reports findings and
      # exits 0; only DRIFT_STRICT=1 (set here) makes it fail.
      - run: node scripts/drift-checks/spec-schema-drift.mjs
        env:
          DRIFT_STRICT: "1"

  schema-compat:
    name: schema ↔ schema backward-compat (#311)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base branch to diff schemas against
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: specification
      # Hard-fail: a backward-incompatible schema change would invalidate
      # existing archives, so it blocks the merge.
      - run: node specification/schema-compat.mjs

# Canonical source of truth for the "Area" dropdown options used at issue intake.
#
# Consumed by:
#   - .github/ISSUE_TEMPLATE/bug_report.yml        (Area dropdown options
#                                                   duplicated here; drift
#                                                   check below enforces match)
#   - .github/ISSUE_TEMPLATE/feature_request.yml   (likewise)
#   - .github/ISSUE_TEMPLATE/enhancement.yml       (likewise)
#   - .github/workflows/issue-labeler.yml          (reads this file with
#                                                   Python + PyYAML to compute
#                                                   VALID_LABELS at runtime)
#
# Enforced by:
#   - .github/workflows/issue-templates-drift.yml  (fails CI if any template's
#                                                   Area dropdown options diverge
#                                                   from this list, or if any
#                                                   template's Area dropdown
#                                                   lacks the `id: area` key
#                                                   the drift check uses to
#                                                   locate it)
#
# Note on `id: area`: it is currently consumed by the drift check above (to
# locate each template's Area dropdown by id rather than label-text) and is
# a prerequisite for any future form-aware labeler action. The existing
# issue-labeler workflow does NOT use the field id — it parses the rendered
# markdown body via awk — but having the id in place now means a future
# tooling swap won't need to touch the templates again.
#
# To add or rename an area: edit this file. CI will tell you which template(s)
# also need their Area dropdown updated to match.

areas:
  - cli
  - spec
  - go-glx
  - import-export
  - ui
  - tooling

name: Feature Request
description: Suggest a new feature (to improve an existing capability, use Enhancement)
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        **Proposing a change to the spec, core data model, entity types, validation rules, or file format?**
        Those require a written proposal and a discussion period before implementation — please start with
        [Proposing Major Changes](https://github.com/genealogix/glx/blob/main/CONTRIBUTING.md#proposing-major-changes)
        rather than this form.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this affect?
      options:
        - cli
        - spec
        - go-glx
        - import-export
        - ui
        - tooling
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem
      description: What limitation or pain point are you trying to address?
      placeholder: |
        I'm trying to do X, but I can't because Y.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposal
      description: What should change?
      placeholder: |
        I propose adding a new command `glx migrate` that...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Context
      description: Use cases, alternatives considered, or implementation notes.
    validations:
      required: false

kind: Changed
body: |-
  **`glx evidence` accepts any assertable subject, not persons only** — The first argument now resolves to a person, event, place, or relationship, matching the subject types `glx add assertion` already accepts via `--subject-person`/`--subject-event`/`--subject-place`/`--subject-relationship`. This matters because the two properties most likely to carry conflicting answers, `date` and `place`, are asserted on the **event** under the modelling the specification itself demonstrates — so an archive following the documented pattern previously had a `glx evidence` that could not be pointed at its contested facts, and the workaround was to add redundant person-level assertions purely to make the command addressable. `glx evidence event-death-1807 date`, `glx evidence event-birth-est date`, and `glx evidence place-liepen name` now work. Resolution tries an exact entity ID across all four subject types first and only then the person name search, so an exact ID can never be shadowed by a substring name match; a query that is the ID of entities of more than one type (only possible in a hand-edited archive, since entity IDs are unique archive-wide) is reported rather than silently resolved by map order, and an ambiguous person name still lists its candidates as before. Property values now resolve against the vocabulary belonging to the subject's own entity type — `event_properties` for an event, `place_properties` for a place, `relationship_properties` for a relationship — rather than always against `person_properties`, and `place` on an event subject resolves to the place's name as the event's structural place field (the same mapping `glx migrate` uses). The failure message changes from `no person found matching "event-death-1807"`, which read as "that person does not exist" and is now simply wrong, to one that names what the command accepts. `--format json` gains `subject`, `subject_type`, and `subject_name`; the existing `person` and `person_name` keys are kept for person subjects so scripts written against the old shape keep working, and are omitted for every other subject type. The person-scoped roll-up the issue raises as a second idea — `glx evidence <person> date` gathering the date assertions from the events that person participates in — is a larger design question and is deliberately not part of this change.

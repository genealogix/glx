kind: Added
body: |-
  **Evidence Explained source classification (`source_nature` / `information_type`)** — Sources can now record the two intrinsic Evidence Explained (Elizabeth Shown Mills, 4th ed., 2024) classification axes as standard source properties instead of free-text notes. `source_nature` (backed by a new `source_natures` standard vocabulary: `original`, `derivative`, `authored`) captures how the source was produced; `information_type` (backed by a new `information_types` vocabulary: `primary`, `secondary`, `indeterminate`) captures the informant's relationship to the event. Both are `vocabulary_type`-constrained, so out-of-vocabulary values surface a validation warning and archives may extend either vocabulary; the two new vocabularies are embedded in `go-glx` and registered through the same path as `legal_statuses` (`embed.go`, the `GLXFile` struct, `vocabularies.go` switch, the validation map, serializer init, and `glx/archive_io.go` merge fallback), each with a matching JSON schema wired into `glx-file.schema.json`. Documented with a new "Source Classification (Evidence Explained)" section on the Source entity page (noting that information quality recorded at the source level is the predominant/default value, that per-fact variation is recorded today via a custom `citation_properties` entry with standardization tracked in #988, and that the third *evidence* axis — direct/indirect/negative — remains an assertion-level concern).
time: 2026-06-05T12:00:00Z

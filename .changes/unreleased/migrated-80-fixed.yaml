kind: Fixed
body: |-
  **`glx validate` now checks cross-references inside a single-file archive** — A `.glx` file handed to `validate` had its cross-reference and place-hierarchy checks skipped unconditionally, on the grounds that the file may be one fragment of a multi-file archive whose references resolve in its siblings. That reasoning does not hold for a self-contained single-file archive: `glx join` writes every entity and every vocabulary into one file, so there is nothing to defer to — and a dangling reference that is a hard error in the multi-file form passed with a green check in the joined one. `validate` now decides per file rather than by argument count. A file counts as a whole archive when it carries at least one entity collection together with at least one vocabulary or property-definition collection (what `glx join` writes, since it merges the standard vocabularies in), or when it declares every entity collection (what `glx init --single-file` scaffolds, empty maps and all); those get the same full pass a directory gets — structural, semantic, cross-reference, place-hierarchy and media-existence checks, with relative media URIs resolved against the file's own directory — and report through the same `Validated N files.` / `✅ Archive is valid.` output. Anything else is still treated as a fragment and keeps the skip, so validating `events/event-births.glx` out of a multi-file archive does not start reporting its siblings' entities as missing. The entity and vocabulary key sets are reflected off `glxlib.AllEntityTypes` and `GLXFile`, so a new entity type or vocabulary is picked up with no parallel list to drift. The fragment path's success line is corrected in the same change: it claimed the file "passed structural and semantic validation" while the semantic pass also filters out the checks that need the rest of the archive, so it now reads "passed the checks that apply without the rest of the archive (cross-reference and place-hierarchy checks skipped)" — the neighbouring overstatement fixed in #658.

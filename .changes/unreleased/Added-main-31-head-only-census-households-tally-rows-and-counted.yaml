kind: Added
body: '**Head-only census households: tally rows and counted-but-unnamed members** — Census events gain an optional `household.tally`, one row per tick-mark column (`sex`, inclusive `age_from`/`age_to`, `count`, free-text `status` such as `free white` or `engaged in agriculture`), so a 1790–1840 style schedule is recorded as enumerated instead of in a note. A person the researcher identifies with a tick mark is attached with the new event role `household_member` and the new participant property `named: false`; a new `relationship_to_head` participant property records the 1880+ column. Such a person counts as found in that census, so `glx analyze` no longer suggests searching it for the wife and children of a head-only household and `glx coverage` ticks the row. Validation checks counts and bracket bounds (errors) and warns on empty rows, unknown `sex`, more unnamed participants than the tally holds, and a tally on a non-census event; bracket bounds are not yet checked against each census''s column headings. `glx census add` templates accept `household.tally` and `named: false` members (who get only a low-confidence residence assertion).'
time: '2026-10-09T00:00:03Z'

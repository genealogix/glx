kind: Fixed
body: '**Vital proofs respect chronology and the event actually recorded** — Burial/cremation dates that certainly precede death are conflicts in proof, consistency analysis and person-merge preview interpretations. Date bounds account for precision, ranges, approximation and calendar conversion; disproven date assertions are excluded and cannot return through stored event fields. Legacy person-level vital dates share these checks; repeated supporting assertions retain their provenance in one conflict per event pair, a legacy person-level date joins the person''s one event of that kind, and a death date recorded on a burial event is compared with that burial. Baptism/burial evidence bounds birth/death instead of claiming the rite''s date as the exact vital date, and marks the remaining gap. Recorded proxy dates can display a bound without inventing evidence or confidence. Other participants'' assertions do not support the target''s birth/death. The after-death check respects roles that merely name a deceased parent and normalized vocabulary presence overrides. Timeline/migration dates share chronological Gregorian/Julian ordering, with `BEF` observations ordered by and preceding their bounds; fact comparison recognizes equivalent Julian/Gregorian dates. Migration attendance remains a labelled visit and does not create movements, while own events, parents at a child''s birth/baptism and roles the vocabulary marks `implies_presence: true` retain their existing weight; a dated residence covering the date still takes precedence. A father named at his posthumous child''s birth or baptism is not reported as an event after his death. **Go API:** `Participation` gains `DeclaredPresent`, true when the role vocabulary sets `implies_presence: true`.'

kind: Changed
body: |-
  **Pinned six third-party GitHub Actions to release commit SHAs** — `golangci/golangci-lint-action` (`lint.yml`), `lycheeverse/lychee-action` and `peter-evans/create-issue-from-file` (`lychee.yml`), `goreleaser/goreleaser-action` (`release.yml`), `DavidAnson/markdownlint-cli2-action` (`lint-markdown.yml`), and `codecov/codecov-action` (`validate-spec.yml`) were floating on bare `@vN` major tags; each is now pinned to its latest release's 40-character commit SHA with a trailing `# vX.Y.Z` comment, matching the repo's existing SHA pins (`golang/govulncheck-action`, `amannn/action-semantic-pull-request`) and the `.github/CLAUDE.md` "always pin to `vX.Y.Z`, never `@vN`" policy. (`codecov/codecov-action` was not in #963's enumerated list but surfaced during the repo-wide sweep the issue calls for, and the OpenSSF Scorecard Pinned-Dependencies check scores it too.) Mutable tags were the attack vector in the March 2025 `tj-actions/changed-files` (CVE-2025-30066, ~23k repos) and `reviewdog/action-setup` (CVE-2025-30154) supply-chain compromises, where existing tags were rewritten to point at malicious commits; SHA pins are immutable and were untouched. The existing Dependabot `github-actions` entry keeps the pinned SHAs (and their version comments) current. First-party `actions/*` floats remain the repo's accepted convention and are out of scope.
time: 2026-06-05T12:00:11Z
custom:

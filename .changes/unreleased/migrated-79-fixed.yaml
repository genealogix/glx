kind: Fixed
body: |-
  **`glx coverage` no longer counts an uncited event as a record found** — The checklist marked a vital record found when the archive held only an *event* of that type, with nothing citing it: `hasEventType(events, EventTypeBirth)` was satisfied by existence alone, and `collectPersonEvents` gathers events purely by participation. The effect was backwards for an evidence-first tool — a conclusion counted as a record, and the score was inflated for exactly the people whose records are missing. An archive holding a birth event that is an explicit estimate reckoned back from a death entry reported `[x] Birth record (via event-birth)` and counted it toward the percentage, which a caller reads programmatically as `"found": true`. A record now counts as found only when evidence backs it: a source about the person, as before, or an event that is the subject of an assertion resolving at least one citation or source. Events carry no citations of their own under the GLX evidence model — the assertion pointing at the event is what supports it — so that walk is the whole question, and a dangling citation or source reference does not count, since reference validation already reports it as an error. The same existence-implies-found rule governed census, marriage, probate and church records, and is corrected in all of them. An event that exists without evidence is not silently dropped: the record is reported not-found with a note naming it (`event-birth is recorded, but no citation or source backs it`), so a conclusion recorded without a source stays distinguishable from a record never looked for, on screen and in `--json`. `glx proof` draws its evidence gaps from this checklist and inherits the correction — a missing birth record now appears as a gap instead of being asserted present while the same report said the birth was not established. Expect scores to fall on archives whose events are uncited; the example archives in `docs/examples/` do, and the drop is the inflation going away. Two adjacent nits are fixed in passing: the coverage command walked `archive.Events` in map order, so a person with two events of one type could report a different one run to run, and the `source_ref` field is no longer populated on a record that was not found, where a caller would read it as evidence. What counts is now stated in `glx coverage --help`. Note that the right-hand side of the check still only recognizes `vital_record` sources, so archives whose births are evidenced by a `church_register` remain under-counted; that is #186 and #1211, not this change. Closes #1267

kind: Added
body: |-
  **Hypothetical and predicted persons for DNA-driven research** — A person can now be marked as a research placeholder for someone not yet identified, such as an unknown ancestor pair predicted from a DNA match cluster, with the new `status` property (`hypothetical`, `predicted`, `resolved`, from the standard `person-statuses.glx` vocabulary). Confidence stays on assertions rather than on the person. `glx analyze` no longer reports missing births, deaths, events or parents for an unresolved placeholder or suggests record searches for it: it lists the placeholder as open and adds a count of open and resolved placeholders. A person whose only recorded parents are placeholders is reported as having no identified parents and still gets brick-wall suggestions. `glx query persons` gains `--status` and labels placeholders, and `glx summary` shows the status. `glx merge-persons` never leaves an unresolved status on a merge with an identified person, whichever side is kept. `glx export` adds a `NOTE` to an unresolved placeholder's `INDI` record, since GEDCOM cannot otherwise express the distinction. Archives created before this change need the updated `vocabularies/person-properties.glx` and `vocabularies/person-statuses.glx` (copy them from `specification/5-standard-vocabularies/`) before giving a person a `status`, or `glx validate` warns; `glx init` writes both for new archives.

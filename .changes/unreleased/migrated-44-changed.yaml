kind: Changed
body: |-
  **The five `check-*` drift commands migrated from slash commands to skills** — `.claude/commands/check-{code,schema,docs}-drift.md`, `check-examples.md`, and `check-spec.md` become `.claude/skills/check-*/SKILL.md` (#833), sharing one output contract (`.claude/skills/check-suite/findings.schema.json` — a single object-wrapper `findings-json` shape every skill emits) and one severity rubric (`.claude/skills/check-suite/severity-rubric.md`, the `critical | major | minor | info` scale). The agreed per-skill improvements are folded in during the move: `check-docs-drift` drives a dynamic `docs/**` glob with ADRs excluded and cross-references Known Issues (#829, #800, #831; supersedes #298); `check-schema-drift` adopts the shared rubric and enumerates schemas dynamically (#838, #986); `check-code-drift` folds in the agreed #676 prompt improvements and #771's accuracy fixes; `check-examples` keeps and expands its Step 1 and points Step 4 at the CI cross-reference, treating westeros as an external pointer (#834, #835, #303, #836); `check-spec` makes the RFC 2119 check tooling-only, adds cross-cutting checks, and delegates snippet validation to `glx validate` with mktemp-safe cleanup (#314, #315, #847, #849). All five carry `model: claude-opus-4-8` frontmatter — the originating slash commands pinned the older `claude-opus-4-7`, and the value is carried over and refreshed to the current recommended Opus (it had been dropped from four of the five during the move). This records **intent**, not an enforced runtime pin: unlike a slash command, a skill runs inline in the active conversation, so the `model:` key does not switch models mid-session — it documents the top-tier model these accuracy-sensitive drift checks are meant to run under, and is forward-compatible if the skills later adopt `context: fork`. To actually run them on Opus today, invoke them from an Opus session (see `.claude/skills/check-suite/README.md`). The eval harness (#796) is deliberately **not** part of this migration: its CI F1-gate conflicts with the "no LLM runs in CI" decision and it needs separate scoping, but its prerequisites (uniform `findings-json` output and the shared rubric) ship here, so it can be picked up standalone. Invocation moves from `/check-*` to the skills surface; documented in `.claude/skills/check-suite/README.md`.
time: 2026-06-05T12:00:00Z

kind: Fixed
body: |-
  **README no longer advertises a 0–3 quality scale, and a rejected vocabulary value now names the accepted ones** — The Features list offered "structured evaluation of evidence reliability (0–3 scale)" as one of seven reasons to adopt GLX, but the only 0–3 scale in the specification is GEDCOM's `QUAY`, which `specification/6-glossary.md` is explicit is *not* mapped into the GLX model — it survives import only as a `GEDCOM QUAY: n` note on the citation for round-trip fidelity. The line was left over from the `quality_ratings` vocabulary removed in beta.5. What GLX actually ships is the three-level `confidence_levels` vocabulary (`high`/`medium`/`low`) plus `source-natures.glx` and `information-types.glx` for classifying the evidence itself, so the line now reads "structured confidence on every assertion, with the nature of the source and of the information recorded separately". A reader who took the old line at face value and reached for `--confidence 0` also got a rejection that named neither the accepted values nor what replaced the scale, so `validateVocabKey()` in `glx/add_runner.go` now appends them: `value not present in vocabulary: confidence_levels="0"; valid values: high, low, medium (see vocabularies/confidence-levels.glx)`. The keys are sorted and capped at 12, after which the message gives the count and defers to the file (`… baptism, bar_mitzvah, birth and 27 more in vocabularies/event-types.glx`), so the 39-entry event-type vocabulary does not bury the value that was refused. The file is always named, since vocabularies are archive-owned and extensible — the fix applies to every vocabulary `glx add` validates, not just confidence. No vocabulary, schema, or accepted-value set changed.

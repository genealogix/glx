kind: Added
body: |-
  **`SECURITY.md` safe-harbor clause and coordinated-disclosure embargo policy** — Adds the two elements the OpenSSF OSPS Baseline Level 2 "coordinated vulnerability disclosure" control was missing. A **Safe Harbor** section (adapted from the [disclose.io](https://disclose.io/) Core Terms, a widely used open-source safe-harbor framework) assures good-faith researchers we will not pursue or support legal action under anti-hacking laws such as the US CFAA for accidental, good-faith policy violations, and sets the guardrails (only test your own machine and data, minimise impact, report before disclosing) that keep research inside that harbor. A **Coordinated Disclosure and Embargo** section publishes the advisory when the fix ships and treats 90 days as a backstop (the outer limit beyond which an issue should not stay embargoed indefinitely; extendable by mutual agreement), names who is inside the embargo (maintainers via the private GitHub Security Advisory draft, plus the reporter), states the embargo-conduct expectations on both sides, and documents how downstream consumers are notified — a published GitHub Security Advisory with a requested CVE that lands in the GitHub Advisory Database and the Go vulnerability database, alerting `go-glx`/`glx` users through `govulncheck`, `dependency-review`, and Dependabot. `SECURITY-POSTURE.md` is updated in step: the Level 2 coordinated-disclosure row flips from partial to met, clearing the last Level 2 gap, so the headline self-attestation advances from Level 1 (most Level 2 met) to **Level 2 (most Level 3 met)**, leaving #269 (SBOM) as the sole remaining gap.

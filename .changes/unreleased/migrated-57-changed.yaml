kind: Changed
body: |-
  **Census suggestions are no longer guessed for archives that name no country** — [#1289](https://github.com/genealogix/glx/pull/1289) tied census suggestions to the country a person's places name, but kept the previous US federal schedule as a fallback for people whose place hierarchy stops short of a `type: country` place, so existing archives behaved as before. That fallback is now off by default: an archive that never says where someone was gets no census rows in `glx coverage` and no census suggestions in `glx analyze` or the `glx ancestors` research notes, rather than being assumed American. Guessing the United States from silence is the US-centric default the issue was filed about, and a wrong country's census years cost a researcher more than an absent suggestion does. Nothing changes for an archive whose places do name a country, including every archive under `docs/examples/`. Researchers whose archives are rooted below the country level can opt back in per run with `--country "United States"` (or any other country in the table) on either command; the durable fix is adding a `type: country` place to the hierarchy, which also tells everyone else reading the archive where those people lived. `--country none` remains accepted and is now a no-op.
time: 2026-10-01T00:00:05Z

body: '**GEDCOM imports deduplicate identical embedded sources** — Inline `SOUR` citations with the same title, description, ordered notes and ordered media reuse the first synthetic source within an import, including empty-description placeholders. Census and media context is attached before matching so unrelated records do not inherit it. Distinct source records and citation details retain their identities, and source counts reflect only newly created entities. Applies to GEDCOM and GEDZIP imports; existing archives are unchanged.'

kind: Added
body: '**`glx publish` now maps the archive''s located places** — The place index opens with a map of every place the archive records coordinates for: one marker per place, sized by how many events happened there (square-root scale, so a parish with 100 events does not swamp one with four), over a graticule of round latitude/longitude lines labelled in degrees. Selecting a marker jumps to that place''s row in the table below, which keeps its existing OpenStreetMap link, and each marker''s tooltip names the full hierarchical place and its event count. Like the family charts and the timeline strip this is inline SVG generated at publish time: no tile server, no map library, no network request at view time — the map works from a USB stick, under `file://`, and in a PDF, which a tile-backed map cannot do, and it leaks nothing about who is reading the site to a third party. The view is fitted to the places themselves rather than to a fixed world projection: the bounding box is padded by 12%, widened to at least a quarter-degree so a cluster of same-parish coordinates is not magnified into a street map, and then stretched on one axis to match the plot''s shape, with longitude scaled by the cosine of the middle latitude so the projection stays undistorted at any latitude. Grid lines use the smallest of 0.05°/0.1°/0.25°/…/45° that keeps six lines per axis, labelled with the hemisphere letter and only as many decimals as the step needs (the equator and the prime meridian get neither letter). Up to 14 markers carry their place name, given in event-count order and skipped where the text would collide with a label already placed, so a dense cluster stays readable. Fewer than two located places produces no map at all, since a single point positions nothing the coordinates themselves do not. `placeRow` now carries the coordinates it previously only used to build the OpenStreetMap link. Third and last of the follow-ups PR #970 left open on the static viewer'

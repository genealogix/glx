kind: Added
body: |-
  **CI: the Go suite now also runs on Windows** — `validate-spec.yml` gains a `test-windows` job (`windows-latest`, displayed as "Go tests (Windows)") running `go test ./glx/... ./go-glx/... ./tools/...`. Until now the Go jobs ran only on `ubuntu-latest`, so a Windows-only breakage reached contributors rather than CI — which is exactly how the two Unix-only test assumptions in #1272 went unnoticed, leaving the `make test` run `CONTRIBUTING.md` asks for permanently red on a Windows checkout. Deliberately a separate job rather than an `os` matrix on `test-conformance`: a matrix renames that job's check contexts to `test-conformance (ubuntu-latest)` and the bare `test-conformance` is a required context in the Main Protection ruleset, so renaming it would leave the ruleset waiting on a check that never reports and deadlock merges. The job carries the same fail-open `changes.outputs.go` gate as the other Go jobs, so a docs-only PR does not pay for it — Windows runners bill at 2x Linux minutes — and it allows 30 minutes against `test-conformance`'s 20, since the same suite is appreciably slower there. Scope is narrower on purpose: no coverage profile or Codecov upload (the Linux run owns that, and a second unflagged report for the same commit would not be meaningful) and no `-v`; the stderr `Warning:` gate stays Linux-only because it tests a property of the code rather than of the platform. The test step sets `shell: bash` rather than taking the `windows-latest` default of `pwsh`, so a non-zero `go test` exit fails the step the same way it does elsewhere in the workflow. **The new check is not required by the branch ruleset on introduction** — adding the `Go tests (Windows)` context to Main Protection is a manual repository-settings change, and until it is made a Windows-only regression shows as a red check that does not block merging.
time: 2026-10-01T00:00:00Z
custom:
  Issue: "#1272"

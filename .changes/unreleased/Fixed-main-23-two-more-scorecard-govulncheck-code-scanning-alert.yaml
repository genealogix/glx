kind: Fixed
body: '**Two more Scorecard / govulncheck code-scanning alerts cleared** — `issue-templates-drift.yml` installed PyYAML with a bare `pip install pyyaml`, which the Scorecard *Pinned-Dependencies* check reports as unpinned ([code-scanning alert 205](https://github.com/genealogix/glx/security/code-scanning/205)). It now installs from `.github/requirements/issue-templates-drift.txt`, which pins `pyyaml==6.0.3` to its published sha256 hashes, with `pip install --require-hashes --no-deps`; a new Dependabot `pip` ecosystem entry for `/.github/requirements` keeps the version and hashes current, with the same cooldown as the other ecosystems. Separately, `GO-2026-5932` (the unmaintained `golang.org/x/crypto/openpgp`, suppressed for osv-scanner by PR #1262) still surfaced through the govulncheck SARIF upload as a module-level note ([code-scanning alert 247](https://github.com/genealogix/glx/security/code-scanning/247)): the advisory has no fixed version, so no `x/crypto` bump can clear it. The Security workflow now filters that SARIF through `scripts/filter-govulncheck-sarif.py`, which drops a finding only when its ID is listed in `osv-scanner.toml` *and* govulncheck reports it at module level, so one reviewed list governs both scanners and a suppressed advisory that becomes imported or called is reported again. `SECURITY-POSTURE.md`''s "Vulnerability suppression" section describes the filter. No GLX code changed.'

kind: Added
body: |-
  **Binary archive cache for fast repeated loading (`glx cache`)** — Every command that loads a multi-file archive re-parses every `.glx` YAML file on each run; on large archives that is tens of seconds and gigabytes of peak memory per invocation. A new opt-in binary cache persists the fully parsed archive to `{archive}/.glx/cache.bin` (via `encoding/gob`) so subsequent loads deserialize a blob instead of re-parsing YAML. New `glx cache build [--force]`, `glx cache clean`, and `glx cache status` subcommands manage it; read commands (`summary`, `query`, `timeline`, `analyze`, `stats`, `vitals`, `places`, `cite`, `cluster`, `coverage`, `diff`, `duplicates`, `evidence`, `path`, `search`, `report`, `export`, and the ancestor/descendant tree) transparently use a fresh cache when one is present. The cache is disposable and best-effort: any detected problem (missing, stale, corrupt, version/struct mismatch, implausibly large, decode failure) silently falls back to the authoritative YAML parse, so a missing, stale, or unreadable cache is ignored rather than trusted. The cache file is size-capped and decoded through a bounded reader before any gob decode, since gob is not hardened against untrusted input (a hostile cache could otherwise be planted in a shared repo). Staleness is decided solely by a stat-only `(path, size, mtime)` fingerprint over all `.glx` files (no file reads); the archive's git `HEAD` commit and clean state are also recorded (read in-process via the pure-Go `github.com/go-git/go-git/v5` library, so no `git` binary on `PATH` is required) and surfaced by `glx cache status`, but do not affect staleness. As with any mtime-based cache, a content edit that preserves a file's size and mtime is the one change the fingerprint cannot see; `glx cache build`/`glx cache clean` forces a refresh in that corner case. `GLX_CACHE=auto` additionally builds the cache on the first miss; `GLX_CACHE=off` bypasses it entirely. `glx init` now git-ignores `.glx/`, and write/transform commands keep parsing YAML directly so their output is never affected by the cache. Scoped to multi-file (directory) archives; single-file archives and parse-time memory reduction are out of scope.

kind: Added
body: |-
  **GEDCOM import/export: FAM.NCHI (number of children)** — The GEDCOM `FAM.NCHI` tag, previously parsed but silently dropped, is now stored as a new `number_of_children` relationship property (integer) on the marriage relationship and round-trips back to `FAM.NCHI` on export. NCHI captures the recorded child count, which can legitimately differ from the number of individually-linked children. A non-numeric payload is preserved verbatim with a warning rather than dropped; NCHI on a spouseless FAM (no relationship to attach to) now warns instead of disappearing silently. Adds the `number_of_children` entry to the `relationship-properties` standard vocabulary.
time: 2026-06-05T12:00:00Z
custom:

kind: Fixed
body: |-
  **Both `PreToolUse` hooks now actually fire (dead-matcher fix)** — Both hooks in `.claude/settings.json` used a `matcher` containing special characters (`"Bash(git commit*)"` from #655 and `"Bash(gh api*)"` from #912). Claude Code compiles any such matcher to a JavaScript regex and tests it against the **tool name** (`"Bash"`), not the command, so neither ever matched and both hooks were dead code. They are now consolidated under a single `"matcher": "Bash"` group (tool name, exact) with the command pattern moved to each handler's `if` field — `if: "Bash(git commit:*)"` and `if: "Bash(gh api:*)"` — which uses permission-rule syntax against the Bash subcommand, per the documented 2026 hooks schema.
    - The **golangci-lint** handler's inlined shell one-liner was extracted to `scripts/claude-hooks/pre-commit-golangci.sh` (`set -euo pipefail`, standalone-runnable, shellcheck-clean) so the logic is reviewable and testable, and it resolves the project root via the documented `${CLAUDE_PROJECT_DIR}` rather than the undocumented `${CLAUDE_WORKING_DIRECTORY}`. It stays advisory (golangci-lint's exit 1 is non-blocking for `PreToolUse`); promoting it to a blocking gate is tracked separately in #870. Fixes #869.
    - The **`gh api` mutation gate** (`scripts/claude-hooks/gh-api-gate.{py,sh}`) had been dead since it was introduced (same defect, never shipped in a release), which would have re-enabled auto-approval of destructive `gh api` calls (GraphQL mutations, REST writes, ref deletion) granted by the `Bash(gh api graphql:*)` / `Bash(gh api repos/genealogix/glx:*)` allow rules — the exact bypass #911/#912 set out to close. With the matcher fixed the gate fires: provably read-only calls stay prompt-free, writes prompt (`ask`), and writes to the git-refs endpoint are hard-blocked (`deny`). (Note: a read whose output is captured via command substitution — `ISSUE_ID=$(gh api graphql …)` — now prompts, because the static parser floors any shell-dynamic command to `ask`; run the bare query if you want it prompt-free.) Its invocation was harmonized to the documented `${CLAUDE_PROJECT_DIR}` form, dropping the undocumented `${CLAUDE_WORKING_DIRECTORY}` fallback; the fail-closed `|| exit 2` is preserved. A duplicate `Bash(gofmt:*)` allow entry was removed in the same pass. Fixes #1014.
time: 2026-06-05T17:30:01Z

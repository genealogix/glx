kind: Changed
body: |-
  **CI: Go jobs are path-scoped on pull requests** — `validate-spec.yml` gains a `changes` job (`dorny/paths-filter`) that decides whether a pull request touches Go-relevant paths — `**/*.go`, `go.mod`/`go.sum`, `ci-tools/**`, `**/testdata/**`, `docs/examples/**`, `specification/schema/**`, the drift allowlist, the `Makefile`, the workflow itself, `.golangci*`, and the non-Go trees embedded into the binary (standard vocabularies, the JSON-LD context, `glx/defaults`, `glx/publish`, `glx/web`). `test-conformance`, `validate-mod`, and `check-code-drift` now carry a job-level `if:` on that output, so a docs-only PR no longer runs the full Go conformance suite. The skip is deliberately a job-level `if:` rather than a trigger-level `paths:` filter: a skipped job still reports its status-check context as success to the branch ruleset, whereas a filtered-out trigger never reports and would leave the required `test-conformance` context stuck on "Expected". The gate fails open — if the `changes` job itself errors, the Go jobs run anyway rather than skipping green. `build-cli`/`validate-example`/`validate-examples` (the aggregator hard-fails unless the build succeeded), `validate-schemas`, and `check-memory-drift` remain ungated, and pushes to `main` still run everything.
time: 2026-10-01T00:00:15Z

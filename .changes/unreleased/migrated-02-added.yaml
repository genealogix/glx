kind: Added
body: |-
  **Deterministic schema/code drift detection (`make check-code-drift`)** — A new Go tool under `tools/driftcheck` compares the `go-glx` type definitions (via reflection) against the JSON Schemas in `specification/schema/v1`, catching structural drift — missing/extra fields, yaml-tag mismatches, `omitempty`-vs-`required` mismatches, and type-family mismatches — on every PR with no API keys. It is the deterministic counterpart to the LLM-based `/check-code-drift` slash command: zero false positives by design, with ambiguous/semantic cases still deferred to the LLM checker. It resolves cross-file and in-file `$ref`s, recurses into nested types (Participant, EntityRef `oneOf`, Submitter, Search), handles the custom `NoteList`/`DateString` marshalers, and compares the unified `VocabularyEntry` against the *union* of every type-vocabulary schema. Known, by-design drift is suppressed by reading `.claude/drift-allowlist.yaml` (matching the same per-symbol identity the slash commands use). Wired into `make check`, runs as a dedicated `validate-spec` CI job, and is guarded by an in-repo regression test that fails if the committed types and schemas ever diverge. The closed-issue staleness gate noted in #797 needs issue-state lookups and remains future work.

kind: Fixed
body: '**`glx analyze`, `glx duplicates` and `glx summary` read the whole given name, not its first word** — In German, Dutch and Scandinavian registers every son may be baptized Johann and every daughter Anna, with the second word the name each went by, and three commands cut the given name to its first word. The consistency check reported siblings Johann Wilhelm and Johann Conrad as "children share given name ''Johann''", the pattern meant for a child who died and was replaced by a namesake; it now compares the full given name, case-folded and with spacing normalized, so only siblings with the same whole name are flagged (two daughters both baptized Catharina still are). It also now reads the structured `given` field from a temporal name list, which it previously skipped. `glx duplicates` scored Johann Georg and Johann Christoffel Wörner at 0.81 on "given similar" and a phonetic match: Soundex dropped the space, so both given names coded as J526. Given names are now compared word by word, hyphens counting as word breaks: each word of the shorter name is paired in order with a word of the longer, the weakest pair is the score, and a name with fewer words is scaled by the share of the longer name''s words it accounts for, so "Georg" against "Johann Georg" scores 0.5 rather than riding on a whole-string edit distance. The phonetic signal codes each full word separately and matches an ordered subset of the name''s words; initials constrain that alignment without earning phonetic credit, so a conflicting initial cannot disappear and turn unrelated names into a hit. The `glx summary` life history named a family''s children "Johann, Michell, Catharina, and Johann"; it now gives each child''s whole given name. Child ordering in that sentence, `descendants` and `publish` is unchanged and remains open in #1364.'

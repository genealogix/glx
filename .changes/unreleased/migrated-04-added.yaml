kind: Added
body: |-
  **`.claude/drift-allowlist.yaml`** — Machine-readable, self-validating allowlist of known, per-symbol drift suppressions for the `/check-*-drift` slash commands, replacing inline "known drift" prose with an auditable file. Each entry is either permanent (by-design) or a temporary deferral that must reference a tracking issue; this is enforced by `.claude/drift-allowlist.schema.json` via the new `make check-drift-allowlist` target, wired into `make check` and the `validate-spec` CI workflow. The closed-issue staleness gate (failing when a temporary entry's tracking issue is closed) is left to the deterministic drift checkers tracked by #673 / #295.
time: 2026-06-05T12:00:04Z

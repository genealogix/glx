kind: Added
body: '**Duplicate relationships are caught** — `glx add relationship` refuses a relationship of the same type between the same participants in the same roles as an existing one, naming it; `--force` adds it anyway with a warning. A parent-child relationship is refused too when another relationship already records every link it makes (one parent and child beside a two-parent relationship for that child). Relationships whose start events or end events both are set and differ (a remarriage) are not duplicates, and disproven relationships are not counted; an undated relationship beside two such remarriages is reported as matching both rather than making them copies of each other. `glx validate` warns on each duplicate and on each parent-child link recorded twice (a generic `parent_child` beside a specific type is reported on the generic one), and `glx ancestors` / `glx descendants` draw a person linked twice the same way only once, keeping the specific type. `glx serve --edit` now uses the same check and answers a duplicate with 409 Conflict.'

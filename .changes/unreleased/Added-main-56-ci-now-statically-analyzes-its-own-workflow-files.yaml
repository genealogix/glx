kind: Added
body: '**CI now statically analyzes its own workflow files** — A new `Workflow Lint` workflow runs [zizmor](https://docs.zizmor.sh/) (template injection, dangerous triggers, cache poisoning, excessive permissions, persisted credentials, unpinned actions, and online checks for known-vulnerable or impostor action commits) and [actionlint](https://github.com/rhysd/actionlint) (syntax, expression types, shellcheck over every `run:` script) on every change to `.github/workflows/` and weekly, failing on any finding; `make lint-workflows` runs the same checks locally. zizmor is installed from a hash-pinned `.github/requirements/zizmor.txt` and actionlint is pinned in `ci-tools/go.mod`, both bumped by Dependabot. Wiring it in fixed the four findings it raised on `main`: `lychee.yml` interpolated the `github.event.repository.name` context and a step output straight into `run:` scripts (now runner env vars), `auto-update-branches.yml` minted a GitHub App token carrying the app''s whole installation grant (now scoped to `contents: write` and `pull-requests: read`), and `release.yml` left the checkout token in `.git/config` for every later step of the signing job (now `persist-credentials: false`). No GLX code changed.'
time: '2026-10-11T00:00:01Z'

kind: Changed
body: |-
  **`CLAUDE.md` files are no longer load-bearing for any policy** — A new rule in the root `CLAUDE.md` (and in `.github/CLAUDE.md`) records that agent guides are never the source of truth: policies, conventions, and decisions belong in project files (`SECURITY-POSTURE.md`, `CONTRIBUTING.md`, `docs/`, `specification/`, `docs/decisions/`), a `CLAUDE.md` may only summarize and point at them, and public documentation must never link to one. Applied in the same change to the GitHub Actions pinning convention, which now lives in full in `SECURITY-POSTURE.md`.
time: 2026-10-01T00:00:12Z

kind: Fixed
body: |-
  **Git Workflow Guide: three copy-paste snippets that failed when run** — All three blocks in `docs/guides/git-workflow.md` were syntactically valid but broke for a reader who actually ran them, which matters for a guide whose value is that people copy from it. (1) The CI workflow's install step downloaded the release asset as `glx.tar.gz` but asked `sha256sum -c` to verify `glx_Linux_x86_64.tar.gz`, which was no longer on disk — the resulting exit 1 failed the job on every run under GitHub Actions' error-on-exit default, giving anyone who copied the workflow a permanently red validation gate that looked like a rejected checksum; the asset now keeps its published name through download, verification, and extraction. (2) The merge-conflict example put a top-level `names:` list beside `properties:`, which `glx validate` rejects (`additional properties 'names' not allowed`, the Person schema being `additionalProperties: false`) — doubly awkward because the same guide wires `glx validate` into a pre-commit hook a few sections earlier, so a reader who resolved the conflict as shown then could not commit; the name now sits under `properties.name` with `value`/`fields`, matching the Quickstart, with the conflict markers still around `occupation`. (3) The Research Cycle staged entity directories by name (`git add persons/ events/ …`), which fails with `fatal: pathspec 'persons/' did not match any files` (exit 128) on a fresh clone, because `glx init` creates those directories empty and Git does not track empty directories — it worked on the author's machine and failed for the collaborator, the exact workflow the guide's Collaboration section encourages; now `git add -A`. The underlying scaffold behavior is tracked separately in #1136.
time: 2026-06-05T12:00:00Z

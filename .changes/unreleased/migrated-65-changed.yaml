kind: Changed
body: |-
  **Documented the GitHub Actions pinning decision for first-party `actions/*`** — Floating major tags (`@vN`) on actions published by the `actions` organization are now recorded as a settled, deliberate choice rather than a pending question. The rationale is written down with its residual risk stated rather than dismissed: a major tag is a mutable ref and a re-pointed one would run with the workflow's permissions, but the publisher is GitHub — the same organization operating the hosted runners — so the likelihood is judged low enough to trade for keeping Dependabot vulnerability alerts, which GitHub raises only for semver-tag references and never for SHA-pinned ones, and for avoiding the maintenance cost of SHA drift across every `uses:` site. Third-party actions — explicitly including `github/*`, which is *not* first-party for this rule — stay SHA-pinned with a trailing version comment, apart from `sigstore/cosign-installer`, which publishes no floating major and is pinned to an exact patch tag. `actions/attest` in the release workflow remains SHA-pinned, an exception scoped to signing and attestation steps rather than to every privileged job. `SECURITY-POSTURE.md` gains an "Action pinning" section that is now the canonical statement of the whole convention — all three pinning tiers, the signing/attestation exception, the three actions that publish no floating major tag (`ossf/scorecard-action`, `mszostok/codeowners-validator`, `sigstore/cosign-installer`), the weekly Dependabot refresh cadence, the accepted OpenSSF Scorecard Pinned-Dependencies ceiling (no allowlist config masks it), and the known limit that a SHA pin does not cover an action's own transitive `uses:` references. Documentation only; no workflow files changed.

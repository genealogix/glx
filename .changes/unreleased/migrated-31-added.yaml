kind: Added
body: |-
  **Deterministic drift-check CI layer (`.github/workflows/drift-checks.yml`)** — Two new no-LLM checks complement the existing `make check-code-drift` (#673): spec↔schema field parity (`scripts/drift-checks/spec-schema-drift.mjs`) compares the field tables in `specification/4-entity-types/*.md` against each `schema/v1/*.schema.json` on both presence and required/optional, **warn-only** (`DRIFT_STRICT=1` makes it blocking) (#309); and schema↔schema backward-compatibility (`specification/schema-compat.mjs`) diffs PR-changed schemas against the base branch with `json-schema-diff-validator` and **hard-fails** on backward-incompatible changes (#311). `validate-schemas.mjs` additionally validates every `5-standard-vocabularies/*.glx` against its vocabulary schema (#839), and `make check-code-drift` findings now carry `go-glx/types.go:NN` source lines via a new I/O-free AST extractor (`tools/internal/structdump`), satisfying #676 item 11 (#795). Both Node checks expose an I/O-free core (`compareEntity`, `classifySchemaChange`) covered by fixture-based `node:test` unit tests (`make test-scripts`, wired into `make check` and the `validate-spec` CI job), so the hand-rolled markdown-table parser and the breaking-vs-compatible classifier are pinned rather than only exercised against the live tree. **#309 remains open**: its acceptance criterion is failing CI on drift, so it tracks the future flip of the warn-only parity check to `DRIFT_STRICT=1` once the parser is proven.
time: 2026-06-05T12:00:00Z
custom:
  Issue: "#309, #311, #839, #795, #1016"

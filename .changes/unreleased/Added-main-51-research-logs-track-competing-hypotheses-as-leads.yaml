kind: Added
body: '**Research logs track competing hypotheses as `leads`** — ResearchLog gains a `leads` list, folding #660''s proposed Research entity into the existing ResearchLog instead of adding a new entity type. Each lead records a `description`, candidate `persons`, a `status` (`active` / `eliminated` / `confirmed`, from the new standard `lead-statuses.glx` vocabulary), free-text `evidence_for` / `evidence_against`, optional `citations` and `assertions` refs, `next_steps`, and `notes`. Leads track research alternatives: a lead has no confidence of its own (confidence stays on the assertions that model it), and resolving a lead never changes the assertions it references. The spec gives Search and ResearchLead their own sections in `research-log.md`. Validation checks every ref and vocabulary value, and `glx rename`, three-way merge, the JSON schema, and the spec all cover the new field. `glx query research_logs` accepts `--subject` (matching the log''s subject or a lead''s candidate person, by ID or name) and `--status`, and `glx summary` gains a Research section listing the person''s logs with objective, status, planned `not_searched` searches, and open leads with their recorded statuses. The complete-family example adds a brick-wall log with two leads. Archives created before this change need `vocabularies/lead-statuses.glx` (copy it from `specification/5-standard-vocabularies/`) before giving a lead a `status`; `glx init` writes it for new archives.'
time: '2026-10-10T00:00:00Z'

kind: Changed
body: |-
  **PR template corrected and given DCO / AI-disclosure reminders** — `.github/PULL_REQUEST_TEMPLATE.md` no longer claims the title "Description must start with an uppercase letter": `lint-pr-title.yml` sets no `subjectPattern`, so casing is not CI-enforced (a lowercase subject passes today). The top comment now names `lint-pr-title` as the source of truth for the allowed type list and notes that on squash-merge this title is normally the commit subject. A grouped "before submitting" comment block adds two reminders the template was missing for policies that live in `CONTRIBUTING.md`: signing off every commit per the DCO (with the `git rebase --signoff` recovery one-liner) and disclosing substantial AI assistance via an `Assisted-by:` trailer (kept SHOULD-level, no mandatory checkbox). The CHANGELOG reminder now mentions the required issue/PR reference, the "Related issues" hint distinguishes a closing keyword from a bare `#123`, "What and why" points spec/data-model changes at the proposal + ADR gate, and "Testing" asks for a screenshot on website/UI changes. The template stays lean (prose/HTML-comment prompts, no rendered checklist) — deliberately not adopting PR-template forms (GitHub has none in 2026), multiple templates, a long checklist, or a bespoke drift check. Automating the DCO check itself is tracked in #1057.
time: 2026-06-05T12:00:00Z

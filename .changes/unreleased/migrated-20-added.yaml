kind: Added
body: |-
  **`glx serve` — local browser-based read-only archive viewer** — A new command that starts a small local web server and prints a URL to open in your browser, serving an interactive, dependency-free viewer for a GLX archive: a dashboard (entity counts, assertion-confidence distribution, evidence coverage), browsable/filterable person profiles (names, vitals, chronological event timeline, family links, and assertions with their resolved citation/source evidence), interactive SVG pedigree and descendancy charts, and a source/citation browser. This is Phase 1 (read-only viewer) of the visual editor proposed in #93 — the bridge from "tool for technical genealogists" to "tool for all genealogists." The UI is a self-contained static bundle embedded in the binary (Go `embed.FS` + vanilla JS, no build step or network access); data is served as JSON over `/api/*` and rendered client-side. The server binds to `127.0.0.1` by default (warning when bound to a non-loopback host), supports `--host`/`--port` (use `--port 0` for any free port), reuses the archive-loading and relationship-traversal helpers shared with `glx summary`/`stats`, and loads the archive once at startup (restart to pick up external edits; live file watching is a later phase).
time: 2026-06-05T12:00:00Z

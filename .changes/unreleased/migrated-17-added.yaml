kind: Added
body: |-
  **`glx publish` — static HTML site generator** — Exports a GLX archive as a self-contained, browsable website for sharing with non-technical family. Generates a landing page with archive stats and an alphabetical person list, a profile page per person (vital facts, hierarchical birth/death places, a life timeline including family events, linked parents/spouses/children/siblings, supporting sources with citation locators and quotes, notes, and a media gallery), source and place indexes (places with coordinates link to OpenStreetMap), and a client-side search page. Output is a plain directory of HTML/CSS/JS — no server, database, or build tooling — that works when opened directly via `file://` (the search index loads as a `<script>`, not `fetch`) or hosted anywhere (GitHub Pages, S3, Netlify). Templates and assets are embedded in the binary. Styling is responsive with a light/dark toggle and print-friendly profile pages, and all archive content is HTML-escaped. Flags: `--output`/`-o` (default `./site`), `--embed-media` to inline images as base64, `--living` to redact likely-living people before publishing (reusing the `--privatize-living` redaction), and `--title`. Implements the first phase of the read-only web viewer; interactive SVG pedigree/descendancy charts, a visual timeline view, embedded maps, and theming config are tracked as follow-ups. Renamed from `glx view` before release to avoid ambiguity with `glx serve` and to name the artifact it produces; the `--serve`/`--port` preview flags were dropped in the same change, since `glx serve` now owns local preview.

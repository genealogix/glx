kind: Fixed
body: '**`glx migrations` reports moves between neighboring places, and not a child''s burial as the parent''s move** — Movements compared the top-level region of each place (the state, or the district), so a man born in one village who married and lived in the next village of the same district had no movement at all, and a move between two counties of one state was invisible. Each observation''s place is now compared along its hierarchy below the country level, and a movement is named at the first level where the two places differ: `Niederkleen → Pohl-Göns` for two villages of one district, `Florida → Wisconsin` for two states as before. A place and a place inside it (a state and one of its towns) are not a move. `--pattern` stops retain the first observation of the most specific place within each stop, so an earlier district-only observation does not hide a village from searches. The bounded-residence override from #1330 uses the same comparison. A parent named on a child''s death, burial, cremation or funeral stays in the timeline but is not counted, since the record places the child rather than the parent''s household; a child''s baptism still counts. JSON `from_region`/`to_region` now hold the differing place names.'

kind: Changed
body: |-
  **`source-properties.glx` descriptions rewritten to be self-contained** — The `abbreviation`, `call_number`, `events_recorded`, and `agency` property descriptions no longer reference GEDCOM tags as their definition (e.g. "(from GEDCOM ABBR tag)"); each now stands on its own for readers unfamiliar with GEDCOM. The GEDCOM origin remains captured in each property's structured `gedcom:` field. `publication_info` carried the identical "(from GEDCOM PUBL tag)" pattern and was cleaned up in the same pass for consistency (not listed in the issue, but the same defect).

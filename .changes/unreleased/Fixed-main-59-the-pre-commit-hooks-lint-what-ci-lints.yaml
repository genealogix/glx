kind: Fixed
body: '**The pre-commit hooks lint what CI lints** — The `golangci-lint` job linted the working tree, so unstaged and untracked files could block a clean commit or hide a staged finding. It used `HEAD` as its baseline, which let `git commit --amend` and commits made with hooks skipped drop their findings out of the check, and it ran whatever golangci-lint was installed against the whole module. It now lints the staged snapshot of the packages the branch changes, for issues new since the merge-base with `origin/main` (as CI''s `only-new-issues` does), and requires the version in `.golangci-lint-version`. The `eslint` job lacked `--max-warnings 0`, so warnings passed locally and failed CI. When `website/node_modules` was missing, `npx` fetched an unpinned eslint, and Windows CRLF checkouts failed `linebreak-style`. It now lints the staged blobs with the `npm run lint` flags and asks for `make install-deps` when dependencies are missing. `npm run lint` and the hook both cover every `.js`, `.mjs`, `.cjs` and `.vue` file under `website/`. Regression tests cover staged configuration and version pins, partially staged sources, deleted Go files and the branch baseline. The skip instructions lead with `git commit --no-verify`, which works in every shell.'
time: '2026-10-11T00:00:04Z'

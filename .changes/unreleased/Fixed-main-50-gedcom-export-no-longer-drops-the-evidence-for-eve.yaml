kind: Fixed
body: '**GEDCOM export no longer drops the evidence for event-subject assertions** — A birth, death or marriage whose date and place are cited through assertions with `subject.event` exported with no `SOUR` subrecord at all, while a person-subject property on the same individual citing the same citation exported its `SOUR` correctly: `buildPersonPropertyAssertionsIndex` was the only index feeding the exporter''s assertion evidence, and it read `assertion.Subject.Person` only, so `assertion.Subject.Event` was never consulted anywhere on the export path. The file was valid GEDCOM with every fact present and only the evidence chain missing, so nothing downstream could tell the dates had ever been sourced — silent loss on the interchange path people use to hand an archive to someone who does not run GLX. A new `buildEventPropertyAssertionsIndex` indexes assertions by `(eventID, property)`, and the `SOUR` is emitted under the event structure itself (`1 BIRT` / `2 SOUR`) rather than on the enclosing `INDI`, which is where GEDCOM 7 puts evidence for an event and what keeps a birth''s citation distinct from a death''s. Family events (`MARR`, `DIV`) go through the same path. Only identical exported `SOUR` structures are collapsed before they are written, so a date assertion and a place assertion reusing one citation emit it once; evidence attached to the event entity itself is deduplicated against the assertion evidence in the same pass. Distinct citation notes and media links survive even when the source and page match or the citation has no page, and two different pages of one source stay two references. Assertion IDs are indexed in sorted order so the subrecords an event receives are deterministic. Both GEDCOM 5.5.1 and 7.0 output are fixed; `docs/examples/complete-family` reproduced the bug and now carries an end-to-end regression test in `glx/e2e/export_test.go`.'

body: '**`go-glx` media filename allocation** — `FilenameAllocator.AllocateMatching` and `ClaimExisting` (both unreleased, #1391) are removed: the allocator keeps only its reservations, and `glx import` decides content reuse through one path for every family size. `resolveOBJE`-based SDK code sees `ConversionContext.MediaFileGroups` for multi-`FILE` objects.'

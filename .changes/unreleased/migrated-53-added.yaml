kind: Added
body: |-
  **`glx publish` now draws pedigree and descendancy charts on every profile** — Each person page gains a "Family charts" section with an "Ancestors" panel (the person, their parents, grandparents, and great-grandparents) and a collapsed "Descendants" panel (the person, their children, and grandchildren). Both are inline SVG generated at publish time — no JavaScript, no chart library, no network request — so they render under `file://`, survive a print-to-PDF, and inherit the site's light/dark theme from the same CSS custom properties as the rest of the page. Every box other than the subject's own is a link to that person's profile, so a reader can walk the tree by clicking. The walk reuses the parent/child index the site model already builds, so publishing a large archive costs one extra pass per person rather than a re-scan of every relationship. Two limits keep a page from exploding: the generation depth above, and a 60-node budget per chart that stops a prolific family from emitting a megabyte of SVG onto one profile — a chart cut short by the budget says so in its caption. Pedigree collapse (the same ancestor reached through two lines) draws the person in both branches, while a malformed self-ancestor cycle terminates instead of looping, because the cycle guard tracks the current path rather than every person already seen. A person with no recorded relatives in a direction gets no chart in that direction rather than an empty frame. This closes the first of the three follow-ups PR #970 left open on the static viewer.

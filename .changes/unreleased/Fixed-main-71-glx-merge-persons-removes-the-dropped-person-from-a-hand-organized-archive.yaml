kind: Fixed
body: '**`glx merge-persons` removes the dropped person from a hand-organized archive** — Entities in a directory the writer did not manage (say `people/family.glx`) were carried across the swap as foreign files, so the dropped person survived there and the kept one ended up defined twice: in its old file and in a new `persons/` copy.'

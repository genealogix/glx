kind: Changed
body: |-
  **`dependency-review.yml` now states its toggles explicitly and hardens snapshot/scorecard handling** — The workflow configured only `fail-on-severity` and `comment-summary-in-pr`, relying on `actions/dependency-review-action`'s internal defaults for everything else. The defaults it depends on are now confirmed in code (`vulnerability-check: true`, `license-check: true`, `show-openssf-scorecard: true`), so the workflow is auditable in isolation and a future major-version default flip cannot silently change the repo's security posture (within v5 the "Unknown license" behavior already changed from v4 in a way that broke some adopters — upstream issue actions/dependency-review-action#1099). Two mild hardening toggles ride along: `retry-on-snapshot-warnings: true` (with the default `120`-second timeout stated explicitly) polls the dependency-graph API until the snapshot is fully indexed — the README-documented mitigation for the Go dependency-submission timing race that can otherwise yield an incomplete diff; and `warn-on-openssf-scorecard-level: 5` (up from the default `3`) surfaces barely-maintained dependencies in the PR comment without noise from healthy ones (informational only — never affects `fail-on-severity`). SHA pinning of the action ref remains tracked in #254 and license allow/deny policy in #340.
time: 2026-06-05T12:00:00Z

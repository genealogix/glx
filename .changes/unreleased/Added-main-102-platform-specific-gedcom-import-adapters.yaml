kind: Added
body: '**Platform-specific GEDCOM import adapters** — `glx import` now detects the exporting program from `HEAD.SOUR` and rewrites its custom tags into standard GEDCOM before conversion. Adapters ship for Ancestry, Family Tree Maker, RootsMagic, Legacy Family Tree, MyHeritage and Findmypast. Ancestry and FTM: `_MILT` becomes a `military_service` event, `_DCAUSE` the death event''s `cause`, and `_APID` an `external_ids` entry plus, on a citation, a `url` to the Ancestry record (previously a citation''s `_APID` was dropped entirely). `_UID` becomes `external_ids` on individuals, sources and repositories for every adapter. HTML markup is stripped from Ancestry, FTM and MyHeritage notes, keeping each link''s destination as `label (url)`. An adapter never rewrites a structure it would convert lossily: a `_MILT` with an unmapped sub-record, a `TYPE` with sub-records, or a `CONT` break is left as an extension, as on the generic path. `--platform <name>` forces an adapter, `--list-platforms` lists them, and `-v` reports the adapter chosen and what it rewrote for both GEDCOM and GEDZIP. Unmapped custom tags are preserved under `gedcom_extensions` as before. In the library, `ImportGEDCOMWithOptions` / `ImportGEDZIPWithOptions` take an `ImportOptions{Platform}`, and `ImportResult` reports `Platform`, `PlatformLabel` and `PlatformRewrites`. A `WWW` under a citation now imports as the citation''s `url`.'

kind: Changed
body: |-
  **Census suggestions are now tied to the country a person's places name** — `glx coverage`, `glx analyze` and the `glx ancestors` research suggestions applied the US federal census schedule to every person in every archive, so a family that never left Mecklenburg-Strelitz was told to search the 1790 and 1800 US censuses. The two hard-coded year lists (`usCensusYears` in `coverage_runner.go` and `usFederalCensusYears` in `analyze_suggestions.go`, which had to be kept in step by hand) are replaced by one table in `glx/census_schedules.go` keyed by country, carrying each country's census years and the per-year research notes that go with them (the US 1850 "first census to list individual names", the 1880 parents'-birthplace columns, the 1890 fire). Each person's schedule is chosen by walking their events' places up the `parent` chain to the first place with `type: country` and matching that name — free text, so a set of aliases maps the spellings archives actually contain (`USA`, `U.S.`, `Scotland`, `Éire`, …) onto canonical names. A person whose places span a move gets both countries' schedules, and each suggestion names its country ("1841 UK census", "1880 US census"). A person whose places name a country GLX has no schedule for gets no census suggestions at all, which is the point: suggesting nothing beats suggesting the wrong country's censuses. The table ships the United States, the United Kingdom (1841–1921, with Scotland, Wales and Northern Ireland mapped onto it), Canada (1851–1931) and Ireland (1901 and 1911 — the earlier returns were destroyed in 1922 or pulped during the First World War); adding a country is adding a claim about that country's archives, so the table is deliberately small and grows by contribution. Archives that name no country for a person — place hierarchies that stop at a state or city — keep the previous behaviour and get the US schedule, so existing archives are unaffected; the new `--country` flag on `coverage` and `analyze` changes that fallback (`--country "United Kingdom"`) or switches it off (`--country none`), and an unrecognized value is an error that names the countries GLX knows. The `glx analyze` brickwall-children suggestion, whose whole premise is that the US 1880 census was the first to record parents' birthplaces, is now only made for children whose places put them in the United States.

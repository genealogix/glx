kind: Fixed
body: '**Duplicate matching respects identity evidence** — Fold Latin accents and sharp-s before Soundex; compare phonetic surname variants in large and cross-archive searches, grouped by given-name initial so a common Soundex code does not become one enormous block; identical names outside the Latin script still match on name alone; keep recorded sex differences, surname-only evidence and sparse social context from producing high-confidence matches. Relationship overlap respects both roles (case-insensitively, with parent-child subtypes treated as one kind of tie) and ignores disproven links, all participant roles are retained and an event counts once when role sets overlap; cross-archive views preserve assertions and presence overrides; different event roles do not count as shared identity evidence, and dated activity after a counterpart''s death/burial or before their recorded birth excludes the pair. Baptism/burial supply fallback vital comparison dates, without treating baptism as a hard birth lower bound. Parent references imply living activity only with explicit presence evidence.'

kind: Added
body: |-
  **Seven new standard source types in `source-types.glx`** — Added `family_bible` (Family Bible records of births, marriages, deaths — often the only pre-civil-registration source for US colonial/antebellum research), `gravestone` (tombstone/headstone inscriptions, cemetery memorials), `dna_test` (genetic test results — autosomal, Y-DNA, mitochondrial DNA), `memoir` (autobiographies, diaries, personal journals), `manuscript` (unpublished manuscripts or typescripts), `map` (historical maps, atlases, survey plats), and `social_media` (social media posts and profiles), growing the standard vocabulary from 18 to 25 types. Source type is an open vocabulary, so archives could already add these as custom types; standardizing the common ones keeps classification consistent across archives and unlocks GEDCOM round-trip. The parallel `SourceType*` constants in `go-glx/constants.go` were extended to match, and the GEDCOM `SOUR.TYPE` import mapping now recognizes the aliases `bible`/`gravestone`/`tombstone`/`headstone`/`dna`/`memoir`/`diary`/`manuscript`/`map`/`social` (explicit-value mapping, no false-positive risk) plus identity mappings for the canonical keys `family_bible`/`dna_test`/`social_media` so all seven types survive a GLX→GEDCOM 7.0→GLX round-trip (the exporter writes `Source.Type` verbatim as the `TYPE` value; without the identity entries these three would re-import as `other`). Title-based inference picks up distinctive phrases (e.g. "family bible", "headstone", "dna test", "survey plat", checked before the broad "land" keyword) while deliberately avoiding the bare word "map" so place names like "Mapleton" do not misclassify. The `source` entity spec and the vocabularies reference were updated in step.

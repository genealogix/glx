kind: Added
body: |-
  **GEDCOM/GEDZIP import now populates `media.properties.original_filename`** — The standard `original_filename` media property ("Original filename before import or renaming") was defined in the vocabulary but never populated by any import path. Relative `FILE` references — including media bundled in a GEDZIP archive, whose entries flow through the same conversion path — now record the source file's basename (pre-canonicalization, pre-rename) when the file is copied into `media/files/`. This preserves the source name in the scenario the property was defined for: a basename collision renames the stored file (`photo.jpg` → `photo-2.jpg`), which previously lost the original name entirely. URL and absolute-path references are unaffected (their URI is preserved verbatim, so nothing is renamed), BLOB-derived files get no entry (their filename is synthesized at import), and an `original_filename` a source already carries is never overwritten. Because a GEDCOM 7.0 `FILE` payload is a URI reference, a percent-encoded basename is decoded before it is recorded (`CharlotteBront%C3%AB.jpg` → `CharlotteBrontë.jpg`), while GEDCOM 5.5.1 payloads are plain paths recorded verbatim so a literal `%` is never mangled; a 7.0 encoding that is malformed, or that decodes to something other than a bare filename (a path separator, a control character, an invisible or bidirectional format character — the ZWNJ/ZWJ joiners used in Persian/Arabic, Indic, and emoji filenames are allowed — invalid UTF-8, `.`/`..`), keeps the raw basename. A `FILE` ref already pointing into `media/files/` — the shape a GLX→GEDCOM export produces — is not stamped while its name is untouched, so a GLX→GEDCOM→GLX round trip cannot fabricate false provenance; if the new import itself collision-renames such a ref (merging two exports), the pre-rename basename is real information and is recorded. Re-running an import of a previously imported GEDCOM stamps the new property on every other relative-`FILE` media entity — additive, but visible when diffing against the earlier archive. Purely additive for round-trips: GEDCOM export emits `uri` verbatim and maps no tag to the property. Adds `MediaPropertyOriginalFilename`/`MediaPropertyBlobSize` constants to `go-glx`.

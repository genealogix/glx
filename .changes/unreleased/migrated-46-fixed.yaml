kind: Fixed
body: |-
  **Spurious "Code scanning configuration error" for gosec and govulncheck** — The Security tab reported *"Golang security checks by gosec and govulncheck are reporting errors"* even though both tools' SARIF uploads succeeded with an empty `error` field on every recent analysis. The cause was structural, not a broken upload: GitHub treats `security.yml` as the Code Scanning **setup** for both Go tools and attributes the conclusion of the whole workflow *run* to every tool that setup configures — not the conclusion of the job that uploaded the SARIF. `security.yml` also carried two jobs that upload nothing and are expected to fail as part of normal operation (`gosec Pin Currency`, which fails by design whenever upstream cuts a release, and `npm Audit`, which fails on any new moderate advisory in the website's tree), so either one firing flagged both Go tools as broken. Both now live in their own workflows — `.github/workflows/gosec-pin-currency.yml` and `.github/workflows/npm-audit.yml` — with triggers, job names, and behavior unchanged; neither was a required status check. `security.yml` is now exactly the two SARIF-uploading jobs, and the invariant is documented in its header and in `.github/CLAUDE.md`.
time: 2026-06-05T12:00:00Z
custom:

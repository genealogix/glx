kind: Changed
body: |-
  **Release job no longer restores a Go build cache writable by `pull_request` runs (`cache: false`)** — `release.yml`'s `Set up Go` step set `cache: true`, restoring the same `actions/setup-go` Go build cache that `pull_request`-triggered workflows (`security.yml`'s govulncheck/gosec, `validate-spec.yml`) populate. Because the release job is privileged — it holds `id-token: write` for cosign keyless signing — restoring a cache a lower-trust run can write is a cache-poisoning path: a poisoned entry would taint the binaries *upstream* of signing, so provenance and signatures wouldn't catch it (the recognized `cache-poisoning` class; cf. the Angular Mar-2026 / TanStack May-2026 advisories). The step now sets `cache: false`; the release job already does a clean `go mod download`, so the cache bought little on a cold tagged build. This is defense-in-depth given Actions cache scope isolation (a fork PR can't directly write the release run's cache — a poisoned entry would first have to land on `main`), removing the trust-boundary bridge entirely. A general rule (`id-token: write` must never coexist with a `pull_request`-reachable cache) was added to the `.github/CLAUDE.md` release section; wiring zizmor's `cache-poisoning` audit into CI (#928) would catch regressions generically.
time: 2026-06-05T12:00:00Z

kind: Changed
body: '**`glx merge`, `glx merge-persons` and `glx migrate` update a multi-file archive in place** — They used to serialize the whole archive into the canonical one-entity-per-file layout and swap it into place, so a hybrid archive (`sources/census/1850.glx`, `people/family.glx`, a top-level `archive.glx`) came out flattened, and an archive with a top-level `.glx` file was refused. They now follow the model `glx rename` adopted: a changed entity, vocabulary entry or metadata block is rewritten in the file that holds it, a removed one is removed from every file defining it (a file left empty is deleted), a new entity gets its own file at `<type>/<id>.glx`, and every other file — including comments and formatting in files with nothing to change — is left alone. Each write is atomic with in-memory rollback, and a file changed on disk since the command loaded it is refused rather than overwritten. While a write runs, `.glx-write-journal` in the archive root records the prior content of every file it touches; a write cut short by a crash leaves it behind, and the next write refuses until it is dealt with. A directory a deleted file leaves empty is removed. The directory swap, its `.bak` backup and the carry-over of media binaries, dot entries, symlinks and foreign files are gone, since nothing outside the rewritten files moves any more. The specification gains a [Writing an Archive](specification/3-archive-organization.md#writing-an-archive) section stating the contract.'

kind: Fixed
body: '**GEDCOM 5.5.1 export no longer makes the bride''s father the groom''s parent** — Since #1321/#1352 a 5.5.1 export writes each non-principal event participant as `1 ASSO` with `2 RELA <role>` under every one of the event''s subjects. A RELA states the associate''s relation *to the INDI that carries it*, so a kinship role on an event with two subjects was a false claim under one of them: the father of the bride at a marriage was written as `RELA Parent` of the groom, and a father entered at each of his daughters'' weddings became the parent of every son-in-law. Kinship roles (`parent`, `child`, `spouse`, `sibling`, `godparent`, `godchild`, `guardian`, `ward`, and the adoptive, foster and step pairs) on an event with more than one subject now go only under the subject(s) a relationship shows the participant holds that kinship to: one whose type carries it (`parent_child` for `parent`, `adoptive_parent_child` for `adoptive_parent`, `sibling` for `sibling`, …), whose roles run in that direction (the father on the parent side, the bride on the child side), and which the archive has not disproven. With a `parent_child` from the father to the bride, `RELA Parent` sits under the bride alone; a `neighbor` link to the groom, a link that runs the other way or a disproven one says nothing about whose parent he is. When no relationship says which subject is meant, the ASSO goes under every subject as `2 RELA Participant` with the role in `2 NOTE Event role: Parent`, the shape already used for labels RELA cannot hold. A role that relates to the event rather than to a person (witness, officiant, informant) and any role on a single-subject event (a parent at a baptism) are unchanged, as is GEDCOM 7.0, which already puts the association on the event as `ROLE FATH`.'

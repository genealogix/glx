kind: Fixed
body: '**`glx validate` can show every error, and lists them in a stable order** — Validate capped its error list at 10 with no way to see the rest, and the 10 it showed changed on every run because the library collected them in map-iteration order. It now takes `--show-first-errors N` with the same meaning as on `import`, `split` and `join` (default 10, `0` for all), and the truncation line names the flag. `GLXFile.Validate()` in go-glx now returns errors and warnings sorted by entity type, then ID, then message, so every caller (and a truncated list) sees the same order run to run; the CLI''s structural diagnostics, duplicate-ID conflicts, and media-file warnings are sorted too. The error limit applies to single-file, directory-schema, and stdin validation, counting individual issues rather than file blocks. Cross-reference failures are now headed `Validation failed: N error(s)` instead of `Error loading archive:`, which is kept for archives that genuinely could not be loaded.'

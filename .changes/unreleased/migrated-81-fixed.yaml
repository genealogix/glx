kind: Fixed
body: |-
  **Cleared the six OSV advisories behind the OpenSSF Scorecard *Vulnerabilities* alert** — Scorecard's weekly run scored the check `4` on `GO-2026-6179`, `GO-2026-6180`, `GO-2026-5932`, `GO-2026-6303`, `GO-2026-6354`, and `GO-2026-6355` ([code-scanning alert 62](https://github.com/genealogix/glx/security/code-scanning/62)). Five are fixed by upgrading. `golang.org/x/crypto` goes `v0.53.0` → `v0.56.0` in the root module, clearing the `x/crypto/ssh` source-address bypass (`GO-2026-6303`/CVE-2026-56854, fixed in 0.55.0) and the two deadlocked-channel DoS advisories (`GO-2026-6354`/CVE-2026-78662 and `GO-2026-6355`/CVE-2026-56855, both fixed in 0.56.0), pulling `golang.org/x/net` `v0.56.0` → `v0.57.0` and `golang.org/x/sys` `v0.46.0` → `v0.47.0` with it. `golang.org/x/mod` goes `v0.35.0` → `v0.40.0` in `ci-tools/go.mod` — the module that carried the two `sumdb` advisories, the tile-verification bypass (`GO-2026-6179`/CVE-2026-56865) and the unauthenticated-hash `Lookup` issue (`GO-2026-6180`/CVE-2026-56864) — bringing `x/sync`, `x/sys`, `x/telemetry`, and `x/tools` along. Both modules stay tidy (`make tidy-check`, `make ci-tools-tidy-check`). All six are dependency bumps to test and tooling paths; no GLX code changed
    The sixth, `GO-2026-5932`, has no fixed version — it marks `golang.org/x/crypto/openpgp` unmaintained rather than patching a defect — and does not apply: `golang.org/x/crypto` is reached only through `github.com/go-git/go-git/v5`, which uses `x/crypto/hkdf` and gets OpenPGP from the maintained `github.com/ProtonMail/go-crypto/openpgp`, so `go list -deps ./...` shows no `x/crypto/openpgp` package in the build graph and `govulncheck` reports it as uncalled. Scorecard's check is version-matched rather than reachability-based and reports it anyway, so a new root `osv-scanner.toml` ignores that one ID with the reasoning and the re-verification command recorded inline. `SECURITY-POSTURE.md` gains a "Vulnerability suppression" subsection stating the rule that file operates under — suppress only what upgrading cannot clear *and* what is provably outside the build graph — so the entry is a documented exception rather than a silent mask, matching the document’s existing stance under Action pinning, where a control’s accepted consequence and known limits are written down rather than papered over.
    Clearing the advisories also required one license-policy addition. GitHub’s license resolver reports the bumped `golang.org/x/*` versions as the compound expression `BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang`, which failed `dependency-review.yml`’s `allow-licenses` list from #340 even though `BSD-3-Clause` is on it. The `LicenseRef` is the Go `PATENTS` file that ships beside the BSD-3-Clause `LICENSE` in every `golang.org/x` module — an *additional* patent grant covering implementations of Go, terminating only if the user sues over Go patents. It adds a right on top of the copyright license and imposes no obligation on GLX or on downstream consumers, so it is added to the allow-list with that reasoning recorded inline, in the same form as every other entry there. No obligation-bearing license was pre-approved.

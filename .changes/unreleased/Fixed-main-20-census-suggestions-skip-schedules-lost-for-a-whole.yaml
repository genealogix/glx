kind: Fixed
body: '**Census suggestions skip schedules lost for a whole state or territory** — The census tables now record early US federal schedules lost per state or territory (1790 Delaware, Georgia, Kentucky, New Jersey, Tennessee, Virginia; 1800 Georgia, Indiana Territory, Kentucky, Mississippi Territory, New Jersey, Tennessee, Virginia; 1810 District of Columbia, Georgia, Indiana Territory, Michigan Territory, Mississippi Territory, New Jersey, Ohio; 1820 Arkansas Territory, Missouri Territory, New Jersey), keyed on the first `state` or `territory` place up the hierarchy of the person''s dated events nearest the census year. When every such place lost its schedules, `glx analyze` and the `glx ancestors` notes no longer suggest the census and `glx coverage` no longer counts it as missing (a census found anyway keeps its row); when only some did, or a jurisdiction has confirmed partial survival (1800 Northwest Territory / Ohio; 1810 Tennessee and Illinois Territory), the suggestion stays with a note. State censuses and other substitutes do not count as surviving federal schedules. Alabama''s 1820 federal survival is unclassified, so searches stay available without a loss claim.'

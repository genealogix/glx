kind: Added
body: |-
  **14 new standard place types, and GEDCOM place-name inference for most of them** — `specification/5-standard-vocabularies/place-types.glx` grows from 16 types to 30. Added as `administrative`: `village` (the rural settlement unit European parish registers are organized by — a German *Dorf*, Polish *wieś* or Scandinavian *by* previously had to be typed `locality`, which is a catch-all and loses the distinction from a hamlet or a neighborhood), `hamlet` (the rung below it), and `reservation` (land reserved for an Indigenous nation, common in Native American records). Added as `geographic`: `estate`, `farm`, `plantation`, and `port`. Added as `institution`: `workhouse` (UK poor law unions), `poorhouse` (US 19th century), `asylum`, `prison`, `fort`, `military_base`, and `school`. The `town` description no longer claims to cover villages. Archives could always define these as custom types; standardizing them keeps the keys consistent across archives and lets GEDCOM import infer them.

    `inferPlaceType()` in `go-glx/gedcom_place.go` now matches keywords for 12 of the new types from a table rather than a chain of `if`s, and — the behavior change to be aware of — matches **whole words** instead of substrings. Substring matching had already made every place named "Estate" a `state` and every "United States" component a `state` rather than a `country` (`"state"` is a substring of both), and would have made "Farmington" a `farm`; all three now type correctly. Order within the table puts the more specific institution keywords first, so "Lancaster County Asylum" is an `asylum` rather than a `county`, "Devon County Lunatic Hospital" an `asylum` rather than a `hospital`, and "Union Poor Farm" a `poorhouse` rather than a `farm`. Three of the new types are deliberately **not** inferred from names — `fort`, `port` and `hamlet` — because those words name far more settlements (Fort Worth, Port Arthur, Hamlet NC) than installations, and a wrong type is worse than the position-derived default; they remain available to set by hand or with `glx add place --type`. The four example archives under `docs/examples/` carry the updated vocabulary.

kind: Fixed
body: |-
  **`go test ./glx/...` now passes on Windows** — Two tests failed on a Windows checkout of `main` on assertions that only hold on a Unix filesystem, so the `make test` run `CONTRIBUTING.md` asks contributors to make before opening a PR always ended red there; the Go CI jobs run on `ubuntu-latest`, so neither was caught. First, the stale-backup refusal (`ErrStaleBackupForeignFile`) interpolated the offending `media/files` directory as an absolute native path, which reads `media\files` on Windows and failed the test asserting the message names `media/files` — the message now reports that entry as a slash-separated path relative to the backup directory it already names, which also shortens it on every platform and matches how the nested-dot-entry case has always reported its finding. Second, `TestPreflightFileOps_ReportsUnexpectedStatError` provoked its unexpected `Lstat` error by planting a regular file as a path component and relying on `ENOTDIR`; Windows returns `ERROR_PATH_NOT_FOUND` there, which Go maps to `os.ErrNotExist` — the "target does not exist, nothing to check" case `preflightFileOps` correctly treats as success — so no error was returned. The test now uses a path with an embedded NUL, which both platforms reject with `EINVAL` when converting it for the syscall, and asserts the error is not `os.ErrNotExist` so the branch under test cannot be satisfied by the accepted case. `preflightFileOps` itself is unchanged: its behaviour was already defensible on both platforms. Fixes #1272
time: 2026-10-01T00:00:31Z

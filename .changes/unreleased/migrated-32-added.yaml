kind: Added
body: |-
  **Two new standard relationship types in `relationship-types.glx`** — Added `civil_union` (legally recognized union distinct from marriage in its jurisdiction) and `common_law_marriage` (marriage established by cohabitation and repute rather than ceremony or registration), growing the standard vocabulary from 20 to 22 types. Both are legally distinct from marriage in many jurisdictions and exist as separate categories in GEDCOM X (`CivilUnion`, `CommonLawMarriage` couple facts) and Gramps (`CIVIL UNION`), so archives previously had to collapse them into `marriage` or `partner`. The parallel `RelationshipType*` constants in `go-glx/constants.go` were extended to match, and the vocabularies reference prose was updated in step. Neither type declares a `gedcom:` mapping — GEDCOM 7.0 has no dedicated tags, and the importer's documented behavior (see #544) of collapsing `MARR TYPE "civil union"` / `"common law"` into a `marriage` relationship plus a `marriage_type` event property is unchanged; declaring `MARR` on these entries would make the GEDCOM→GLX reverse lookup ambiguous. Whether GEDCOM import should map recognized `MARR TYPE` values onto the new relationship types (which would also require widening the export-side FAM reconstruction filter that currently emits only `marriage` relationships) is a separate behavioral decision, deliberately not made here.
time: 2026-06-05T12:00:00Z

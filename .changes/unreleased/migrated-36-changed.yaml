kind: Changed
body: |-
  **gosec bumped from v2.22.4 to v2.27.1, with the pin moved to a `.gosec-version` single source of truth and a weekly currency check** — The `@v2.22.4` pin (mid-2025) had gone ~5 minor releases stale and was hardcoded in four places (`security.yml`, twice in `ci-tools/README.md`, a `Makefile` comment). It is deliberately invisible to Dependabot — gosec is kept out of `ci-tools/go.mod` because its autofix package drags in the Google Cloud SDK/gRPC/OTel tree (#480), and the `github-actions` ecosystem doesn't parse `go install ...@vX.Y.Z` run lines — so it had no automated bump path and rotted silently, missing analyzers added after v2.22.4 that map squarely onto GLX's untrusted-archive threat surface (G120 unbounded stream parsing, G122 `filepath.Walk`/`WalkDir` symlink TOCTOU, G707–G709 unsafe deserialization). The version now lives in a top-level `.gosec-version` file (mirroring the `.golangci-lint-version` pattern from #272): `security.yml` installs from it (after validating the `vMAJOR.MINOR.PATCH` shape), a new `make gosec` target runs the same pinned version locally, and `ci-tools/README.md` references the file instead of hardcoding versions. As the sustaining mechanism, a new `gosec-pin-currency` job in `security.yml` runs on the weekly schedule only (never on PRs, so an upstream release can't block unrelated work) and fails when `.gosec-version` is behind `securego/gosec`'s latest release, turning silent rot into a red weekly run. The newly active G122 analyzer immediately flagged three real `os.ReadFile`-inside-`WalkDir` sites (`glx/fileops.go`, `glx/validation_runner.go`, `tools/driftcheck/main.go`); these are suppressed with per-site justified `#nosec G122` annotations pointing at #1090, which tracks the proper root-scoped (`os.Root`) containment fix — the same symlink-escape class as #972/#775. `SECURITY-POSTURE.md`'s static-analysis row now documents the pin/currency mechanism and the G120/G122 ↔ GEDZIP zip-slip/decompression-bomb threat-model mapping (complementary to CodeQL dataflow, #1031).

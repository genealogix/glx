kind: Added
body: |-
  **`civil_union` and `common_law_marriage` standard relationship types** — Both are legally distinct from marriage in many jurisdictions and exist as separate categories in GEDCOM X (`CivilUnion`, `CommonLawMarriage` couple facts) and Gramps (`CIVIL_UNION`), but GLX archives previously had no standard way to record the distinction — researchers had to file both under `marriage` or `partner` (or define custom types). Added to `relationship-types.glx` with parallel `RelationshipType*` constants and a new exported `IsCoupleRelationshipType` helper in `go-glx`. Every couple-relationship check in the CLI analysis tools (`analyze` spouse indexing, `coverage` marriage records and family-source detection, `timeline` family traversal, `summary` spouse listing) now goes through that helper, so the new types participate in analyses instead of being silently skipped. GEDCOM import semantics are unchanged: GEDCOM 5.5.1/7.0 have no dedicated tag for either (both are conventionally `MARR` with a free-text `TYPE`), so `MARR` still imports as a `marriage` relationship with the `TYPE` value preserved in the `marriage_type` property — each new vocabulary entry's comment documents this round-trip; mapping known `TYPE` values onto the new types at import time is a possible follow-up. The `partner` description gains a sentence delimiting it from both new types: `partner` stays the home for informal domestic partnership/cohabitation, while `civil_union` covers the legally formalized kind. Gramps' `UNMARRIED` is deliberately not added as a type — an unmarried couple is `partner` by definition.

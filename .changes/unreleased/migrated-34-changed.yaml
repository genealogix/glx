kind: Changed
body: |-
  **`blob_size` media property description clarified** — The `media-properties.glx` description (rendered on the standard-vocabularies page) now documents the value as the length in bytes of the *encoded* GEDCOM 5.5.1 BLOB text as the `BLOB`/`CONT` lines joined with newlines (pre-decode; includes the line separators) — which is what the importer has always stored — instead of implying the decoded binary size. The `MediaPropertyBlobSize` constant comment matches. Description-only; no behavior change.
time: 2026-06-05T12:00:00Z

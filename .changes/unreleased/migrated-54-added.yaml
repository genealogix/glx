kind: Added
body: |-
  **Release archives now ship an SBOM** — `.goreleaser.yml` gains a `sboms:` stanza that emits one SPDX-JSON software bill of materials per release archive (`glx_Linux_x86_64.tar.gz.sbom.json` alongside `glx_Linux_x86_64.tar.gz`), generated by syft, GoReleaser's default SBOM tool. GoReleaser lists each SBOM in `checksums.txt` alongside the archives, so the SBOMs are covered by both the existing cosign keyless signature and the SLSA build-provenance attestation, which take that manifest as their subject. The syft invocation pins explicit `args` rather than inheriting GoReleaser's default, to drop `--enrich all`: enrichment fetches package metadata from online sources at build time, letting a third-party service feed content into an artifact signed inside the privileged release job. Note that the SBOMs are **not** byte-reproducible regardless — syft's SPDX output embeds a random `documentNamespace` UUID and a `created` timestamp — so the `.sbom.json` lines of `checksums.txt` differ on every build of the same tag even though the archive lines still reproduce byte-for-byte (#1049); a rebuild-and-compare audit has to compare the archive lines rather than the whole manifest, which `SECURITY-POSTURE.md` now states as a known limit. `release.yml` installs syft with a SHA-pinned `anchore/sbom-action/download-syft` step before the GoReleaser step, since syft is not preinstalled on `ubuntu-latest`; that pin does not make the step hermetic (the action fetches and executes syft's `install.sh` from a mutable tag ref at run time), so the posture doc records it as an explicitly accepted risk under Action pinning. Verifying an SBOM is the same flow as verifying an archive (verify `checksums.txt`, then `sha256sum -c`); see `SECURITY-POSTURE.md`. SBOMs first appear on releases cut from the next tag onward — `v0.0.0-beta.12` and earlier publish none — and the posture document scopes its claim accordingly. Local `make release-snapshot` now also needs `syft` on `PATH`, and passes `--skip=sign` so the snapshot build no longer requires `cosign` or an interactive keyless OIDC prompt (`--snapshot` implies only `--skip=announce,publish,validate`). This closes the last remaining OpenSSF OSPS Baseline gap, so the self-attestation in `SECURITY-POSTURE.md` advances to Level 3 (mature). Closes #269

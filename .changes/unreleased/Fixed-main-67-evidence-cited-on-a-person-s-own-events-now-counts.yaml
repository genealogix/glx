kind: Fixed
body: '**Evidence cited on a person''s own events now counts as theirs** — `glx coverage`, `glx proof`, `glx analyze` and `glx publish` read a person''s sources only from assertions whose subject is the person, but a vital fact is an assertion about the event, and a parish register entry has no other shape. A person whose every date was cited from a `church_register` through their baptism and burial events was told to search for church records and vital records, `proof` listed "Church records" under Evidence Gaps beside evidence that was entirely church-register citations, and the person''s published page listed none of those sources. A new `AssertionPersons` helper in `go-glx` names the people an assertion is about: its subject person, or for an event the participants whose role makes it their own record (principal, subject, bride, groom, the child of a baptism, a census household member), never witnesses, godparents or informants. Coverage''s source-type rows (church, probate, land, military, the vital-record title match), `proof`''s Evidence Gaps, `analyze`''s vital-record suggestion, single-source check and census-years-from-sources index, and `publish`''s per-person source and media lists all use it. `collectPersonSources` also stops matching an event or place whose ID happens to equal the person''s.'

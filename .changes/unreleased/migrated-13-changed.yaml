kind: Changed
body: |-
  **`/check-schema-drift` slash command emits a machine-readable findings block plus provenance, cross-reference, and false-positive fixes** — Parallels the structured-output work for the sibling `check-*` commands. (1) A `findings-json` fenced block is appended after the prose report — valid JSON with one object per drift carrying `scope` (`entity | archive_root | vocabulary_type | vocabulary_property | meta`), `target`, `schema_path`, `spec_path`, `json_pointer`, `category`, `severity` (`critical | major | minor | info`, rubric tracked by #838), `drift_direction` (`spec_to_schema | schema_to_spec`), and a `message` — so the eval harness (#796) can compute precision/recall against a deterministic fence instead of free-form markdown. (2) A **Provenance** header records the commit SHA, run timestamp, the schema files actually visited (to catch silently dropped files), and the `make check-schemas` exit status. (3) A **Cross-Reference with Known Issues** section layers an open-issue scan on top of the existing file-backed `.claude/drift-allowlist.yaml` so triaged drift is not re-surfaced. (4) The **Output Format** template now covers all four scopes (entity / archive root / type vocabulary / property vocabulary) with fixed headings rather than only `## [Entity Type]`. (5) The "Required Fields Alignment" check now excludes the `Entity ID (map key)` table row — a parent-map keying constraint, not an entity property — removing a per-entity false positive. (6) A "Files to ignore" subsection excludes `embed.go`, READMEs, and any non-`.schema.json` file. (7) Field-description comparison is replaced with a two-tier structural-vs-wording rule to stop scoring paraphrase as drift. The prompt's `allowed-tools` frontmatter gains `Bash(git rev-parse:*)`, `Bash(date -u:*)`, `Bash(make check-schemas:*)`, and `Bash(gh issue list:*)`; `.claude/settings.json` gains the matching `Bash(date -u:*)` entry (the others were already allowed).

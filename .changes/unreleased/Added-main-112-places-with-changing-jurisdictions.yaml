body: '**Places with changing jurisdictions** can now record a dated list of `{value, date}` parents or keep their existing scalar parent. Historical labels and census, proof and migration reports follow date-supported paths. Census research suggests all plausible jurisdictions; changing jurisdictions alone never moves the person. Undated views use the explicit default, otherwise the most recent parent. Native GLX preserves the full history; GEDCOM exports a single label. Validation, search, rename and three-way merge account for historical parent links.'

kind: Changed
body: |-
  **`glx init` now makes the archive directory a Git repository** — `init` wrote a `.gitignore` into a directory that was never a Git repository and never became one, so the format's Git-native story ("Initialized multi-file GENEALOGIX *repository*", a README headlining version control) was contradicted by the result: the one artifact hinting at version control, `.gitignore`, was exactly the artifact that looked already handled. `glx init` now scaffolds the repository itself, for both the multi-file and `--single-file` layouts. It is scaffolding only — no files are staged and no commit is made — so the user can set their identity, rename the branch, or edit the archive before the first commit records anything. The branch follows git's own resolution: the user's `init.defaultBranch` (global scope, then system scope) if set and valid, else `main`. Two cases deliberately do not create a repository, and the output says which world you are in either way: an archive created inside an existing repository is left to that repository, since a nested repository would hide it from the outer one, and the new `--no-git` flag skips the step entirely, printing `Not a Git repository — run 'git init' to enable version control and collaboration` in place of the repository lines. The repository is created in-process with `github.com/go-git/go-git/v5` — already a dependency for the archive cache — so the CLI still has no runtime dependency on a `git` binary on `PATH`, and a failure to create it is a warning on stderr rather than an error, since the archive itself is already on disk and usable. `docs/quickstart.md` and `docs/guides/git-workflow.md` are updated to match; the git-workflow guide previously told readers to run `git init` themselves. Note this changes what a fresh `glx init` leaves on disk: scripts that assumed no `.git` directory, or that ran `git init` afterward, should pass `--no-git` (a second `git init` in the same directory is harmless, but the assumption is now wrong). Fixes #1273

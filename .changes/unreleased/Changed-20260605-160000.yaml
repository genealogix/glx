kind: Changed
body: |-
  **govulncheck is now version-pinned via a Go 1.24 `tool` directive** — Added a dedicated `ci-tools/` module (`ci-tools/go.mod`) whose `tool` directive pins `govulncheck` (`v1.3.0`), making it the single source of truth for CI and local runs. The `security.yml` `govulncheck` job drops the third-party `golang/govulncheck-action` (which installed `govulncheck@latest` — unpinned) and now runs `go tool -modfile=ci-tools/go.mod govulncheck -format sarif ./...`, keeping the existing Code Scanning SARIF upload. A **separate** module is used deliberately so the tool's transitive dependencies stay out of the root `go.mod`/`go.sum` and are never inherited by consumers importing `go-glx` as a library; it lives in `ci-tools/` rather than `tools/` because `tools/` already holds the first-party `tools/driftcheck` package (part of the main module), and a `tools/go.mod` would have pulled that package into the isolated tool module. A new `make vulncheck` target runs the same pinned tool locally; a `ci-tools-tidy-check` target (and matching `validate-spec` CI step) keeps `ci-tools/go.mod` tidy, and Dependabot's `gomod` ecosystem now watches `/ci-tools` so the pin stays current. **gosec stays on its existing version-pinned `go install ...@v2.22.4`**: its `autofix` package pulls the Google `generative-ai-go`/Cloud SDK/gRPC/OpenTelemetry tree, whose (unreachable, build-time-only) advisories would otherwise make `dependency-review` block every PR. `golangci-lint` (pinned via `.golangci-lint-version`, see #272) and `goreleaser` likewise remain on their dedicated actions.
time: 2026-06-05T16:00:00Z

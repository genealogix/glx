kind: Added
body: |-
  **`glx migrations` — track geographic movement patterns** — New read command that traces a person's geographic movement over time by collecting every dated place observation: events the person participated in (birth, census, marriage, …), their children's birth events (a child's birthplace is evidence of the parent's residence at that date), and `residence` property values in all three property shapes (plain string, structured map, temporal list). Observations are sorted chronologically and each change of region is reported as a movement (e.g. `Florida → Wisconsin (ABT 1832 – ABT 1852)`). Regions compare at the state/region level of the place hierarchy — the topmost ancestor below the country/continent level — and pre-statehood territories match their successor states ("Florida Territory" equals "Florida"), so a birth in a territory followed by a census in the later state doesn't read as a move. `--pattern "Florida,Wisconsin"` searches the whole archive instead, for persons whose region sequence contains the given places in chronological order (matching region names or any name in the place hierarchy path) — knowing who else made the same migration narrows the search for a person's family. `--family` also prints the timelines of the person's immediate family (spouses, parents, children), and `--format json` emits the report on the machine-readable stream so `glx --quiet migrations … --format json` stays scriptable. Not to be confused with `glx migrate`, which upgrades archive data.

kind: Changed
body: |-
  **JSON schemas migrated from draft-07 to JSON Schema 2020-12** — Every `*.schema.json` under `specification/schema/` (the meta-schema, all entity schemas, and all vocabulary schemas), plus the repo-internal `.claude/drift-allowlist.schema.json` and `.claude/skills/check-suite/findings.schema.json`, now declares `"$schema": "https://json-schema.org/draft/2020-12/schema"`. The draft-07-isms were migrated mechanically: `definitions` → `$defs` (with all `#/definitions/...` `$ref`s rewritten), and the Place schema's latitude↔longitude co-requirement moved from array-form `dependencies` to `dependentRequired`. Validation behavior is unchanged — the renames are identity-preserving, and the Go validator (`santhosh-tekuri/jsonschema/v6`, swapped in by #268) already speaks 2020-12 natively. The Node tooling went dialect-aware: `validate-schemas.mjs` and `validate-drift-allowlist.mjs` import ajv's `2020` class (the default `ajv` export is draft-07-only), the meta-schema now requires the 2020-12 dialect declaration, and `tools/driftcheck` reads `$defs`. Because `json-schema-diff-validator` (the schema↔schema backward-compatibility gate, #311) predates 2020-12 and would flag the keyword renames as breaking removals, `schema-compat.mjs` gained an exported `normalizeDialect()` that canonicalizes both sides to draft-07 keywords before diffing — dialect renames diff as no-ops while real structural breaks still fail the gate (unit-tested in `schema-compat.test.mjs`). The `check-code-drift` and `check-schema-drift` skills now state the dialect explicitly so LLM-assisted checks don't suggest draft-07 idioms, and ADR-0007 records the decision (2020-12 now; TypeSpec-as-upstream deferred, not rejected). Consumers validating archives against the published schemas need a 2020-12-capable validator; most maintained validators read both drafts.

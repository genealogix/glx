kind: Fixed
body: |-
  **Release workflow hardening** — Release runs now carry a per-tag concurrency group (the tag ref is part of the group name) with `cancel-in-progress: false`, so a duplicate run of the same tag collapses while distinct tags still release in parallel; keying the group on the workflow instead would have dropped releases outright, because GitHub keeps only one *pending* run per group and cancels the older one — three tags pushed together would lose the middle tag's archives, checksums, signature, attestation and announce. `cancel-in-progress` stays false because killing a run between asset upload and signing would leave an unsigned release (#1008). The GoReleaser tool version is pinned to a patch-floating minor (`~> v2.18`) — the action SHA pin covers the action, not the tool binary it downloads, so `~> v2` could build different artifacts from the same source on a later run; the pin is invisible to Dependabot and needs a currency gate (#1215) (#1009). The Discord announce payload is built with `jq --arg` instead of hand-spliced `\"` escapes, since the `-beta*` trigger glob admits any non-slash character and git permits `"` in a ref name, so a raw tag splice could emit malformed JSON; the tag is `@uri`-encoded where it lands in a URL, and `${{ github.repository }}` in `run:` is replaced by the runner-provided `$GITHUB_REPOSITORY` per the repo's env-staging rule.
time: 2026-09-10T16:00:01Z
custom:
  Issue: "#1008, #1009, #1010"

kind: Added
body: '**`glx publish` profiles now plot the life timeline to scale** — Above the chronological list on each person page sits a proportional timeline strip: a bar spanning the person''s first to last dated event, one dot per dated event positioned by year, and an axis labelled in round years. Long gaps now read as gaps — a decade with no records looks like one, where the list gave every row equal height. Like the family charts it is inline SVG generated at publish time (no JavaScript, no chart library, no network request), scales to the page width, and takes its colors from the site''s theme variables. Each dot carries the full event as an SVG `<title>`, so hovering names the date, event, and place, and the chronological list stays exactly as it was underneath — the strip is an overview, not a replacement, and undated events continue to appear only in the list. Axis labels are chosen so they cannot collide: the step is the smallest of 1/2/5/10/20/25/50/100/…/2000 years that keeps the label count within six, the span''s own endpoints are always labelled, and an interior label that would sit closer than 40 units to its neighbour is dropped rather than drawn overlapping. Years before the common era render as "44 BCE", matching the rest of the site. A person whose dated events fall in a single year (or who has none) gets no strip, since a proportional view of a single point says nothing the list does not. Timeline rows now also carry the event''s parsed year, and `eventYear` shares the year-display helper rather than repeating the BCE formatting. Second of the three follow-ups PR #970 left open on the static viewer.'

kind: Added
body: '**Census page neighbors on census events** — Census events gain an optional `neighbors` list (`name` and/or `person` reference, `position` such as `previous_household`, `page`, `line`, `notes`) for FAN research; a `person` must exist. `glx census add` accepts `household.neighbors`, and `glx cluster` scores a neighbor linked to a person as a `census_neighbor` link (2 points), in both directions. `glx analyze` suggests cross-referencing each neighbor on the household head until a relationship or shared non-census event ties them to the household.'
time: '2026-10-09T00:00:04Z'

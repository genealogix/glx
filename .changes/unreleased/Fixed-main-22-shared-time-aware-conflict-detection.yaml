kind: Fixed
body: '**Shared, time-aware conflict detection** — `analyze`, `proof`, `evidence`, and `merge-persons` now share comparison rules for dates, place hierarchies, free text, and researcher status. Temporal histories with disjoint or touching periods no longer conflict; uncertain overlaps are possible conflicts, and undated temporal values do not create inferred conflicts. Explicit disputes remain visible even without a known date. Approximate date values agree within ±2 years, configurable with `--approximation-years`. Analysis includes event and relationship assertions plus duplicate birth/death events. Evidence and proof separate undated history; possible conflicts weaken proof support without making it CONFLICTED. Person merges silently accept identical values and retain non-conflicting history. Validation warns on reversed date ranges. Single-file proofs load the same standard definitions as directory archives; participant and existence disputes remain unresolved, undated Markdown claims retain their details, and mixed-calendar periods remain possible overlaps. Merges preserve disagreements already present within either person''s history. The Go SDK exposes full conflict, evidence, proof, and coverage workflows with owned typed results, raw fact provenance, read-only defaults, and shared option validation; the CLI delegates to these APIs. Archive-wide analysis indexes claims once per run, and tied evidence groups use raw identity and date for deterministic ordering. Marriage coverage records and proof gaps are ordered by relationship ID, and explicit nil property overrides disable legacy and structural comparison defaults. Typed SDK histories merge as valid dated entries, and single-file merges no longer persist comparison-only vocabulary defaults. Participation evidence preserves each person, role, and date; coverage selects sources deterministically, and birth/death conflicts apply legacy participant roles only to the matching event type. Proof compares legacy vital aliases with event facts, preserves literal text and participant identity, and lists supporting media. Media-backed events count toward coverage, and fixed-property merges retain narrower date and place refinements. Proof and coverage require appropriate principal roles, synthetic vital facts cannot prove claims, and media-linked coverage returns the source that matched. Person merges respect disproven status and preserve structured fields. Legacy vital defaults apply only to person properties, and unrelated resolutions preserve established proof answers. Only claims answering a proof question strengthen its conclusion; media evidence retains raw IDs and deduplicates repeated reports. Builds on MoSattler''s date-overlap contribution and boundary tests in PR #1227.'
